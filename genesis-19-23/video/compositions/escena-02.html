  tl.fromTo(inicial(el(x), { clipPath: "inset(-30% 103% -30% -3%)" }), { opacity: 1, clipPath: "inset(-30% 103% -30% -3%)" },
    { clipPath: "inset(-30% -3% -30% -3%)", opacity: 1, duration: d, ease: "none", stagger: o.st ?? 0, ...IR }, t);
}
// Trazo de tiza: la línea se dibuja en vivo.
const _largos = new Map();
// Las escenas que no están en pantalla al cargar están ocultas, y ahí getTotalLength()
// devuelve 0. Se mide una copia del trazo dentro de un SVG auxiliar que sí se dibuja.
function sonda(p) {
  let s = document.getElementById("sonda-trazos");
  if (!s) {
    s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.id = "sonda-trazos";
    s.setAttribute("style", "position:fixed;left:0;top:0;width:10px;height:10px;visibility:hidden;pointer-events:none");
    document.body.appendChild(s);
  }
  const c = p.cloneNode(false);
  s.appendChild(c);
  return c;
}
function largo(p) {
  const c = sonda(p);
  const L = c.getTotalLength();
  c.remove();
  return L;
}
function preparaTrazos(x) {
  el(x).forEach((p) => {
    if (_largos.has(p)) return;
    const L = largo(p);
    _largos.set(p, L);
    p.style.strokeDasharray = L + " " + (L + 2);
    p.style.strokeDashoffset = L;
  });
}
function traza(x, t, d = 1, o = {}) {
  const ps = inicial(el(x), { opacity: 0 });
  preparaTrazos(ps);
  tl.fromTo(ps, { strokeDashoffset: (i, p) => _largos.get(p), opacity: 1 },
    { strokeDashoffset: 0, opacity: 1, duration: d, ease: o.ease ?? "power1.inOut", stagger: o.st ?? 0, ...IR }, t);
}
// Un objeto que recorre un trazo mientras se dibuja (Agar, los reyes, Abrán).
// Los puntos del camino se miden una sola vez al construir; durante el render solo se interpola.
function medirCamino(path, N = 400) {
  const p = sonda(el(path)[0]);
  const L = p.getTotalLength();
  const pts = [];
  for (let i = 0; i <= N; i++) { const q = p.getPointAtLength((L * i) / N); pts.push([q.x, q.y]); }
  p.remove();
  return pts;
}
function ponEnCamino(objs, pts, k) {
  const N = pts.length - 1;
  const f = Math.min(N, Math.max(0, k * N)), i = Math.floor(f), r = f - i, j = Math.min(N, i + 1);
  const x = pts[i][0] + (pts[j][0] - pts[i][0]) * r, y = pts[i][1] + (pts[j][1] - pts[i][1]) * r;
  objs.forEach((e) => e.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")"));
}
// Solo el primer recorrido de un objeto fija su posición inicial; los siguientes
// arrancan donde terminó el anterior.
const _colocados = new WeakSet();
function recorre(obj, path, t, d, o = {}) {
  const pts = typeof path === "string" || path instanceof Element ? medirCamino(path) : path;
  const objs = el(obj);
  const st = { k: o.desde ?? 0 };
  if (!objs.some((e) => _colocados.has(e))) { objs.forEach((e) => _colocados.add(e)); ponEnCamino(objs, pts, st.k); }
  tl.to(st, { k: o.hasta ?? 1, duration: d, ease: o.ease ?? "power1.inOut", onUpdate: () => ponEnCamino(objs, pts, st.k) }, t);
}
function cuenta(x, desde, hasta, t, d, fmt = (v) => Math.round(v).toString()) {
  const e = el(x)[0];
  const st = { v: desde };
  if (!_colocados.has(e)) { _colocados.add(e); e.textContent = fmt(desde); }
  tl.to(st, { v: hasta, duration: d, ease: "power1.out", onUpdate: () => (e.textContent = fmt(st.v)) }, t);
}
function camara(x, t, d, props, ease = "power2.inOut") {
  tl.to(el(x), { ...props, duration: d, ease }, t);
}
// Paneo lento sobre una ilustración (Ken Burns), sin salirse del marco.
function kb(x, t0, t1, desde, hasta) {
  tl.fromTo(el(x), { scale: desde.s ?? 1.08, xPercent: desde.x ?? 0, yPercent: desde.y ?? 0 },
    { scale: hasta.s ?? 1.0, xPercent: hasta.x ?? 0, yPercent: hasta.y ?? 0, duration: Math.max(0.1, t1 - t0), ease: "none" }, t0);
}
const fmtMiles = (v) => Math.round(v).toLocaleString("es-CO");

// ---------- piezas repetidas ----------
// Filtro de tiza para los trazos: borde levemente irregular.
root.insertAdjacentHTML("afterbegin",
  '<svg width="0" height="0" style="position:absolute"><defs>' +
  '<filter id="tz-' + ID + '" x="-5%" y="-5%" width="110%" height="110%">' +
  '<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>' +
  '<feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs></svg>');
const TIZA = "url(#tz-" + ID + ")";

// Tarjeta de capítulo: el número de capítulo y su subtítulo.
function capitulo(x, t0, t1) {
  const c = el(x)[0];
  entra(c.querySelector(".num"), t0, { y: 60, d: 0.8 });
  escribe(c.querySelector(".sub"), t0 + 0.5, 0.9);
  traza(c.querySelectorAll("path"), t0 + 0.3, 0.8);
  if (c.querySelector(".edad")) entra(c.querySelector(".edad"), t0 + 0.9, { y: 20 });
  sale(c, t1, { y: -60, d: 0.6 });
}

// Entrada y salida de toda la escena: el fondo es común, solo se funde el contenido.
function marco() {
  tl.fromTo($(".contenido"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
  tl.to($(".contenido"), { opacity: 0, duration: 0.5, ease: "none" }, DUR - 0.55);
}

// Bloques de texto que se reemplazan en el mismo lugar: cada uno entra en su momento y sale
// justo antes del siguiente. Si `hasta` es null, el último se queda.
function secuencia(lista, hasta = null, o = {}) {
  lista.forEach(([s, t], i) => {
    entra(s, t, { y: o.y ?? 26, d: o.d ?? 0.55 });
    const sig = i < lista.length - 1 ? lista[i + 1][1] : hasta;
    if (sig != null) sale(s, sig - 0.4, { d: 0.35 });
  });
}
// Pone marcado SVG dentro de un elemento de la escena.
function pinta(sel, svg) { $(sel).innerHTML = svg; }

// ---------- mapas ----------
// Encuadre de cámara: lleva la región {x, y, w, h} de la imagen del mapa a la ventana
// {x, y, w, h} de la pantalla (relativa al contenedor .mapa), sin deformarla.
function encuadre(r, v) {
  const s = Math.min(v.w / r.w, v.h / r.h);
  return { scale: +s.toFixed(4), x: +(v.x + (v.w - r.w * s) / 2 - r.x * s).toFixed(1), y: +(v.y + (v.h - r.h * s) / 2 - r.y * s).toFixed(1) };
}
// Latido de un marcador: crece y vuelve, un número finito de veces.
function late(x, t, o = {}) {
  tl.fromTo(el(x), { scale: 1 }, { scale: o.s ?? 1.35, transformOrigin: "50% 50%", duration: o.d ?? 0.35, yoyo: true, repeat: o.n ?? 3, ease: "power1.inOut", immediateRender: false }, t);
}

// ---------- lecciones ----------
// Cada lección entra en su momento y sale antes de la siguiente; el número cuenta.
function lecciones(lista) {
  const cab = $(".seccion");
  if (cab) { entra(cab, 0.3, { y: -20 }); traza(".seccion-linea path", 0.6, 1.0); }
  secuencia(lista, null, { y: 30, d: 0.6 });
}


// La puerta de una ciudad amurallada, vista de frente (viewBox 0 0 1100 860).
// Se usa en Génesis 19 (Lot sentado a la puerta) y en Génesis 23 (la compra ante testigos).
// `p` es un prefijo para que los ids de degradados no choquen entre escenas.
function puertaSVG(p) {
  const bloques = (x0, y0, w, h, alto = 34, ancho = 78) => {
    let s = "";
    for (let y = y0, fila = 0; y < y0 + h - 2; y += alto, fila++) {
      const off = fila % 2 ? ancho / 2 : 0;
      for (let x = x0 - off; x < x0 + w; x += ancho) {
        const xa = Math.max(x, x0), xb = Math.min(x + ancho, x0 + w);
        if (xb - xa > 6) s += `<rect x="${xa + 2}" y="${y + 2}" width="${xb - xa - 4}" height="${Math.min(alto, y0 + h - y) - 4}" rx="3"/>`;
      }
    }
    return s;
  };
  const almenas = (x0, x1, y, paso = 44) => {
    let s = "";
    for (let x = x0; x < x1 - 10; x += paso) s += `<rect x="${x}" y="${y - 26}" width="${paso * 0.58}" height="28" rx="2"/>`;
    return s;
  };
  const toldo = (x, y, w, c1, c2) => {
    let s = `<g class="toldo"><rect x="${x + 8}" y="${y + 40}" width="8" height="${86}" fill="#5b4631"/><rect x="${x + w - 16}" y="${y + 40}" width="8" height="86" fill="#5b4631"/>`;
    const n = 6;
    for (let i = 0; i < n; i++) s += `<path d="M ${x + (i * w) / n} ${y} L ${x + ((i + 1) * w) / n} ${y} L ${x + ((i + 1) * w) / n + 6} ${y + 44} L ${x + (i * w) / n + 6} ${y + 44} Z" fill="${i % 2 ? c2 : c1}"/>`;
    s += `<rect x="${x + 10}" y="${y + 104}" width="${w - 14}" height="22" rx="4" fill="#7a5c3c"/>`;
    s += `<circle cx="${x + 34}" cy="${y + 98}" r="10" fill="#d9a441"/><circle cx="${x + 56}" cy="${y + 99}" r="9" fill="#a8c46a"/><circle cx="${x + w - 40}" cy="${y + 97}" r="11" fill="#c96a3c"/></g>`;
    return s;
  };
  return `
  <defs>
    <linearGradient id="${p}-muro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c8d73"/><stop offset="1" stop-color="#6d624f"/></linearGradient>
    <linearGradient id="${p}-torre" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a99a7e"/><stop offset="0.7" stop-color="#8d7f66"/><stop offset="1" stop-color="#6f644f"/></linearGradient>
    <linearGradient id="${p}-hueco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15110d"/><stop offset="0.75" stop-color="#3a2b1c"/><stop offset="1" stop-color="#e2b565" stop-opacity="0.85"/></linearGradient>
    <linearGradient id="${p}-suelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4235"/><stop offset="1" stop-color="#2b2a28"/></linearGradient>
    <linearGradient id="${p}-hoja" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b4a2c"/><stop offset="1" stop-color="#4a321d"/></linearGradient>
  </defs>
  <path d="M 0 640 L 1100 640 L 1100 860 L 0 860 Z" fill="url(#${p}-suelo)"/>
  <g stroke="#5a5244" stroke-width="2" opacity="0.5"><line x1="550" y1="640" x2="80" y2="860"/><line x1="550" y1="640" x2="1020" y2="860"/><line x1="0" y1="720" x2="1100" y2="720"/><line x1="0" y1="800" x2="1100" y2="800"/></g>
  <rect x="0" y="210" width="1100" height="430" fill="url(#${p}-muro)"/>
  <g fill="#000" opacity="0.13">${bloques(0, 210, 300, 430)}${bloques(800, 210, 300, 430)}</g>
  <g fill="#9c8d73">${almenas(0, 300, 210)}${almenas(800, 1100, 210)}</g>
  <rect x="290" y="120" width="190" height="520" fill="url(#${p}-torre)"/>
  <rect x="620" y="120" width="190" height="520" fill="url(#${p}-torre)"/>
  <g fill="#000" opacity="0.12">${bloques(290, 120, 190, 520, 36, 64)}${bloques(620, 120, 190, 520, 36, 64)}</g>
  <g fill="#a99a7e">${almenas(290, 480, 120, 40)}${almenas(620, 810, 120, 40)}</g>
  <g fill="#1d1812"><rect x="372" y="200" width="18" height="54" rx="9"/><rect x="702" y="200" width="18" height="54" rx="9"/><rect x="372" y="330" width="18" height="54" rx="9"/><rect x="702" y="330" width="18" height="54" rx="9"/></g>
  <rect x="480" y="250" width="140" height="390" fill="url(#${p}-muro)"/>
  <path d="M 488 640 L 488 400 A 62 62 0 0 1 612 400 L 612 640 Z" fill="url(#${p}-hueco)"/>
  <path d="M 488 400 A 62 62 0 0 1 612 400" fill="none" stroke="#5e5443" stroke-width="10"/>
  <path d="M 488 640 L 488 404 L 446 420 L 446 648 Z" fill="url(#${p}-hoja)" stroke="#2e1f12" stroke-width="3"/>
  <path d="M 612 640 L 612 404 L 654 420 L 654 648 Z" fill="url(#${p}-hoja)" stroke="#2e1f12" stroke-width="3"/>
  <g fill="#3a2a1a"><circle cx="466" cy="530" r="5"/><circle cx="634" cy="530" r="5"/></g>
  <g class="bancos"><rect x="180" y="604" width="104" height="30" rx="6" fill="#b8aa8e"/><rect x="186" y="632" width="92" height="12" fill="#7d725e"/>
  <rect x="816" y="604" width="104" height="30" rx="6" fill="#b8aa8e"/><rect x="822" y="632" width="92" height="12" fill="#7d725e"/></g>
  ${toldo(24, 500, 150, "#c96a3c", "#e8c79a")}
  ${toldo(930, 500, 150, "#4f7aa8", "#e8c79a")}`;
}

pinta(".puerta", puertaSVG("p02"));
capitulo(".f-cap .capcard", 0.3, at("Al atardecer") - 0.2);
const tA = at("Al atardecer");
entra(".f-a .cab", tA, { y: -10 });
aparece(".dib", tA + 0.1, 0.8);
tl.fromTo($(".dib svg"), { scale: 1.08 }, { scale: 1, duration: 3, ease: "power2.out", transformOrigin: "50% 60%", immediateRender: false }, tA);
salta(".lot", at("Lot estaba sentado"), { desde: 0.3 });
aparece(".l-plaza", at("era la plaza"), 0.6);
traza(".fl-viaj", at("llegaban los viajeros"), 1.0);
aparece(".l-viaj text", at("llegaban los viajeros"), 0.5);
aparece(".l-merc", at("los mercados"), 0.6);
aparece(".l-noti", at("las noticias"), 0.6);
aparece(".l-anc", at("los ancianos"), 0.6);
late(".bancos", at("para juzgar"), { s: 1.04, n: 3 });
atenua([".l-plaza", ".l-viaj", ".l-merc", ".l-noti"], at("Lot insiste"), 0.25);
late(".lot circle", at("hospedar"), { s: 1.4 });
secuencia([[".b1", tA + 0.3], [".b2", at("En una ciudad amurallada")], [".b3", at("Ninguna publicación")], [".b4", at("En esa época")]]);

marco();
window.__timelines[ID] = tl;
})();
</script>
