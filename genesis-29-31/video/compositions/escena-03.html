    '</g>';
}

// Cabra, mirando a la derecha: negra, o con manchas blancas; `portador` le pone el aro dorado.
function cabra(x, y, s = 1, o = {}) {
  const f = o.izq ? -1 : 1;
  const manchas = o.manchas ? '<path d="M -34 -60 C -24 -72 -8 -66 -10 -52 C -14 -42 -30 -44 -34 -60 Z" fill="#f4eee0"/>' +
    '<path d="M 6 -46 C 16 -58 34 -52 30 -40 C 26 -32 10 -34 6 -46 Z" fill="#f4eee0"/>' +
    '<circle cx="-20" cy="-36" r="6" fill="#f4eee0"/><circle cx="22" cy="-64" r="5" fill="#f4eee0"/><circle cx="56" cy="-82" r="4" fill="#f4eee0"/>' : "";
  const rayas = o.rayas ? '<path d="M -40 -58 L -30 -38 M -22 -66 L -12 -36 M -4 -68 L 6 -36 M 14 -66 L 22 -38" stroke="#efe6d2" stroke-width="5" stroke-linecap="round"/>' : "";
  const aro = o.portador ? '<ellipse class="aro" cx="4" cy="-44" rx="86" ry="66" fill="none" stroke="#f0c75e" stroke-width="7" stroke-dasharray="14 10"/>' : "";
  return '<g class="' + (o.cls || "") + '" transform="translate(' + x + ' ' + y + ') scale(' + (s * f) + ' ' + s + ')">' +
    aro +
    '<ellipse cx="0" cy="2" rx="56" ry="8" fill="rgba(0,0,0,0.22)"/>' +
    [[-32, -2], [-18, 0], [20, 0], [34, -2]].map(([lx, ly]) => '<path d="M ' + lx + ' -36 L ' + (lx + 2) + ' ' + ly + '" stroke="#1d1714" stroke-width="7" stroke-linecap="round"/>').join("") +
    '<path d="M -48 -58 C -50 -80 -20 -84 10 -80 C 36 -78 50 -70 52 -56 C 54 -38 36 -30 6 -30 C -26 -30 -46 -36 -48 -58 Z" fill="' + G("negra") + '"/>' +
    manchas + rayas +
    '<path d="M -46 -66 C -56 -80 -58 -88 -52 -92 C -48 -84 -44 -76 -40 -70 Z" fill="#221b17"/>' +
    '<path d="M 40 -70 C 46 -90 56 -100 66 -102 C 78 -104 86 -96 86 -86 C 86 -76 80 -70 72 -68 C 62 -66 52 -62 46 -56 Z" fill="' + G("negra") + '"/>' +
    '<path d="M 64 -100 C 58 -118 44 -126 34 -122 C 44 -118 52 -110 58 -98 Z" fill="#8b7a62"/>' +
    '<path d="M 70 -101 C 68 -118 58 -130 48 -130 C 58 -124 64 -114 66 -100 Z" fill="#a8977c"/>' +
    '<path d="M 80 -72 C 82 -62 78 -54 74 -50 C 72 -58 72 -66 74 -72 Z" fill="#2a221d"/>' +
    '<circle cx="74" cy="-90" r="3.2" fill="#e9bf60"/>' +
    '</g>';
}

// Piedra redondeada con luz desde arriba.
function piedra(cx, cy, rx, ry, cls = "") {
  return '<g class="' + cls + '"><ellipse cx="' + cx + '" cy="' + (cy + ry * 0.55) + '" rx="' + rx * 1.02 + '" ry="' + ry * 0.45 + '" fill="rgba(0,0,0,0.28)"/>' +
    '<path d="M ' + (cx - rx) + ' ' + cy + ' C ' + (cx - rx) + ' ' + (cy - ry * 1.1) + ' ' + (cx + rx) + ' ' + (cy - ry * 1.15) + ' ' + (cx + rx) + ' ' + cy +
    ' C ' + (cx + rx) + ' ' + (cy + ry * 0.6) + ' ' + (cx - rx) + ' ' + (cy + ry * 0.62) + ' ' + (cx - rx) + ' ' + cy + ' Z" fill="' + G("piedra") + '" stroke="#4d473f" stroke-width="3"/>' +
    '<path d="M ' + (cx - rx * 0.6) + ' ' + (cy - ry * 0.55) + ' C ' + (cx - rx * 0.2) + ' ' + (cy - ry * 0.85) + ' ' + (cx + rx * 0.3) + ' ' + (cy - ry * 0.8) + ' ' + (cx + rx * 0.55) + ' ' + (cy - ry * 0.5) + '" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="6" stroke-linecap="round"/></g>';
}

// Tablilla de arcilla con escritura cuneiforme (cuñas pequeñas en renglones).
function tablilla(x, y, w, h, cls = "") {
  let cunas = "";
  let semilla = 7;
  const rnd = () => { semilla = (semilla * 9301 + 49297) % 233280; return semilla / 233280; };
  for (let fila = 0; fila < 9; fila++) {
    const fy = y + h * 0.13 + fila * h * 0.085;
    let fx = x + w * 0.1;
    while (fx < x + w * 0.88) {
      const l = 10 + rnd() * 16;
      if (rnd() > 0.72) {
        cunas += '<path d="M ' + fx.toFixed(1) + ' ' + (fy - 9).toFixed(1) + ' l 8 5 l -8 5 z" fill="#7d5132"/>';
      } else {
        cunas += '<path d="M ' + fx.toFixed(1) + ' ' + (fy - 3).toFixed(1) + ' l ' + l.toFixed(1) + ' 3 l ' + (-l).toFixed(1) + ' 3 z" fill="#7d5132"/>';
      }
      fx += l + 6 + rnd() * 8;
    }
    cunas += '<path d="M ' + (x + w * 0.07) + ' ' + (fy + h * 0.04) + ' L ' + (x + w * 0.93) + ' ' + (fy + h * 0.04) + '" stroke="rgba(110,70,40,0.45)" stroke-width="2"/>';
  }
  return '<g class="' + cls + '" filter="' + G("sombra") + '">' +
    '<path d="M ' + (x + 18) + ' ' + y + ' L ' + (x + w - 14) + ' ' + (y + 4) + ' Q ' + (x + w) + ' ' + (y + 6) + ' ' + (x + w - 2) + ' ' + (y + 24) + ' L ' + (x + w + 4) + ' ' + (y + h - 20) + ' Q ' + (x + w + 2) + ' ' + (y + h) + ' ' + (x + w - 20) + ' ' + (y + h - 2) +
    ' L ' + (x + 16) + ' ' + (y + h + 3) + ' Q ' + (x - 2) + ' ' + (y + h) + ' ' + (x) + ' ' + (y + h - 20) + ' L ' + (x - 4) + ' ' + (y + 22) + ' Q ' + (x - 2) + ' ' + y + ' ' + (x + 18) + ' ' + y + ' Z" fill="' + G("arcilla") + '" stroke="#7b5033" stroke-width="3"/>' +
    cunas + '</g>';
}

// Sol con halo y luna creciente (día y noche, 31:40).
function sol(cx, cy, r, cls = "") {
  return '<g class="' + cls + '"><circle cx="' + cx + '" cy="' + cy + '" r="' + r * 2.2 + '" fill="' + G("sol") + '"/><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffe07a"/></g>';
}
function luna(cx, cy, r, cls = "") {
  return '<g class="' + cls + '"><circle cx="' + cx + '" cy="' + cy + '" r="' + r * 1.9 + '" fill="rgba(200,215,255,0.12)"/>' +
    '<path d="M ' + cx + ' ' + (cy - r) + ' A ' + r + ' ' + r + ' 0 1 0 ' + cx + ' ' + (cy + r) + ' A ' + r * 1.25 + ' ' + r * 1.25 + ' 0 0 1 ' + cx + ' ' + (cy - r) + ' Z" fill="#e8ecf6"/></g>';
}
// Rama pelada a trozos: corteza oscura con franjas de madera blanca (30:37).
function rama(x1, y1, x2, y2, cls = "") {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ang = Math.atan2(dy, dx) * 180 / Math.PI;
  let franjas = "";
  for (let i = 0; i < 7; i++) {
    const a = 20 + i * (L - 40) / 7;
    franjas += '<rect x="' + a.toFixed(1) + '" y="-9" width="' + ((L - 40) / 14).toFixed(1) + '" height="18" rx="4" fill="#f2ead6"/>';
  }
  return '<g class="' + cls + '" transform="translate(' + x1 + ' ' + y1 + ') rotate(' + ang.toFixed(2) + ')">' +
    '<rect x="0" y="-11" width="' + L.toFixed(1) + '" height="22" rx="11" fill="#5b3d26" stroke="#3a2616" stroke-width="3"/>' + franjas +
    '<path d="M ' + (L * 0.3).toFixed(1) + ' -8 l 26 -30" stroke="#5b3d26" stroke-width="8" stroke-linecap="round"/>' +
    '<path d="M ' + (L * 0.3 + 26).toFixed(1) + ' -38 c 14 -8 26 -4 30 4 c -12 6 -22 4 -30 -4 z" fill="#7aa35a"/></g>';
}

// El pozo del campo cerca de Harán (Génesis 29:2, 3), en corte: se usa en las escenas 03 y 04.
// Coordenadas de pantalla (1920x1080). Suelo en y = 600.
function pozoEscena(o = {}) {
  const S = 600;
  let capas = "";
  for (let i = 0; i < 5; i++) {
    const y = S + 70 + i * 80;
    capas += '<path d="M 0 ' + y + ' C 400 ' + (y - 14) + ' 900 ' + (y + 16) + ' 1920 ' + (y - 6) + '" stroke="rgba(60,40,20,0.35)" stroke-width="3" fill="none"/>';
  }
  let piedritas = "";
  let sem = 11;
  const r = () => { sem = (sem * 9301 + 49297) % 233280; return sem / 233280; };
  for (let i = 0; i < 70; i++) {
    const x = r() * 1920, y = S + 40 + r() * 420;
    if (x > 700 && x < 960) continue;
    piedritas += '<ellipse cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" rx="' + (4 + r() * 10).toFixed(1) + '" ry="' + (3 + r() * 6).toFixed(1) + '" fill="rgba(70,50,30,0.35)"/>';
  }
  const bloques = [];
  for (let fila = 0; fila < 3; fila++) for (let k = 0; k < 6; k++) {
    const w = 44, x = 700 + k * w + (fila % 2 ? 22 : 0);
    if (x + w > 972) continue;
    bloques.push('<rect x="' + x + '" y="' + (S - 84 + fila * 28) + '" width="' + (w - 3) + '" height="25" rx="5" fill="' + G("piedra") + '" stroke="#5d574e" stroke-width="2"/>');
  }
  return defsDibujos() +
    '<rect x="0" y="0" width="1920" height="' + S + '" fill="' + G("cielo") + '"/>' +
    '<path d="M 0 ' + (S - 60) + ' C 300 ' + (S - 110) + ' 520 ' + (S - 70) + ' 760 ' + (S - 96) + ' C 1100 ' + (S - 130) + ' 1400 ' + (S - 70) + ' 1920 ' + (S - 100) + ' L 1920 ' + S + ' L 0 ' + S + ' Z" fill="#c9c28a" opacity="0.8"/>' +
    '<g class="sol-g">' + sol(1500, 130, 64) + '</g>' +
    '<rect x="0" y="' + S + '" width="1920" height="' + (1080 - S) + '" fill="' + G("tierra") + '"/>' + capas + piedritas +
    '<rect x="0" y="' + (S - 8) + '" width="1920" height="16" fill="' + G("pasto") + '"/>' +
    // Agua de la capa subterránea que alimenta el pozo.
    '<path class="napa" d="M 0 960 C 300 940 600 975 830 955 C 1100 935 1500 975 1920 950 L 1920 1030 C 1500 1050 1100 1015 830 1035 C 600 1050 300 1020 0 1035 Z" fill="' + G("agua") + '" opacity="0.85"/>' +
    // El pozo: hoyo revestido de piedra hasta el agua.
    '<g class="hoyo"><rect x="760" y="' + S + '" width="140" height="' + (975 - S) + '" fill="#2a1d12"/>' +
    '<rect x="760" y="' + S + '" width="14" height="' + (975 - S) + '" fill="#6d6457"/><rect x="886" y="' + S + '" width="14" height="' + (975 - S) + '" fill="#6d6457"/>' +
    '<rect x="774" y="905" width="112" height="70" fill="' + G("agua") + '"/>' +
    '<path class="cuerda" d="M 830 ' + (S - 100) + ' L 830 870" stroke="#c8a36a" stroke-width="4"/>' +
    '<path class="pozal" d="M 812 870 L 848 870 L 842 898 L 818 898 Z" fill="#7a4a24" stroke="#4b2a12" stroke-width="3"/></g>' +
    // Brocal: muro bajo de piedra alrededor de la boca.
    '<g class="brocal">' + bloques.join("") + '</g>' +
    // Pilón para que beban los animales.
    '<g class="pilon"><rect x="1030" y="' + (S - 58) + '" width="260" height="58" rx="10" fill="' + G("piedra") + '" stroke="#4d473f" stroke-width="3"/>' +
    '<rect x="1046" y="' + (S - 48) + '" width="228" height="16" rx="6" fill="' + G("agua") + '"/></g>' +
    // La gran piedra sobre la boca.
    '<g class="tapa">' + piedra(836, S - 100, 170, 58) + '</g>' +
    // Tres rebaños echados cerca.
    '<g class="reb1">' + oveja(130, S + 4, 1.05) + oveja(280, S + 10, 1.0) + oveja(420, S + 2, 1.05, { izq: true }) + oveja(210, S + 34, 1.1) + '</g>' +
    '<g class="reb2">' + oveja(1390, S + 6, 1.05, { izq: true }) + oveja(1520, S + 12, 1.0) + oveja(1460, S + 36, 1.1, { izq: true }) + '</g>' +
    '<g class="reb3">' + oveja(1680, S + 4, 1.0, { izq: true }) + oveja(1820, S + 14, 1.05, { izq: true }) + oveja(1750, S + 38, 1.1, { izq: true }) + '</g>';
}

pinta(".lienzo", pozoEscena());
const E = (s) => root.querySelector(".lienzo " + s);
// Corte del terreno: el subsuelo se descubre de arriba abajo cuando la voz explica qué es un pozo.
tl.set([E(".hoyo"), E(".napa")], { opacity: 0 }, 0);
entra(".ini", 0.4, { y: 20 });
sale(".ini", at("La piedra tapaba") - 0.5);
aparece(E(".reb1"), at("tres rebaños"), 0.5);
aparece(E(".reb2"), at("tres rebaños") + 0.3, 0.5);
aparece(E(".reb3"), at("tres rebaños") + 0.6, 0.5);
tl.set(E(".tapa"), { opacity: 0 }, 0);
salta(E(".tapa"), at("una gran piedra"), { desde: 0.6, r: 0 });
aparece(".e-piedra", at("una gran piedra") + 0.4, 0.4);
aparece(E(".hoyo"), at("en hebreo beér"), 0.8);
aparece(".e-pozo", at("un hoyo"), 0.4);
aparece(E(".napa"), at("un agua natural"), 0.8);
aparece(".e-agua", at("un agua natural") + 0.3, 0.4);
entra(".cist", at("No es una cisterna"), { y: 30 });
sale(".cist", at("Alrededor tenía") - 0.2, { y: 20 });
aparece(".e-brocal", at("un brocal"), 0.4);
late(E(".brocal"), at("un brocal"), { s: 1.04, n: 1 });
aparece(".e-pilon", at("pilones"), 0.4);
[".e-pozo", ".e-agua", ".e-brocal", ".e-pilon", ".e-piedra"].forEach((s) => atenua(s, at("La piedra tapaba"), 0.0, 0.4));
entra(".c1", at("suciedad"), { x: -30, y: 0 });
entra(".c2", at("no cayeran animales"), { x: -30, y: 0 });
entra(".c3", at("Sin tapa"), { x: -30, y: 0 });
tl.set(".polvo", { opacity: 0 }, 0);
tl.fromTo($(".polvo"), { opacity: 0, x: -120, y: -30 }, { opacity: 1, x: 40, y: 60, duration: 2.2, ease: "power1.out", immediateRender: false }, at("el viento lo llenaba"));
tl.to($(".polvo"), { opacity: 0, duration: 0.6 }, at("el viento lo llenaba") + 2.2);
tl.to(E(".sol-g"), { scale: 1.25, transformOrigin: "1500px 130px", duration: 1.2, ease: "power2.out" }, at("el sol se llevaba"));

marco();
window.__timelines[ID] = tl;
})();
</script>
