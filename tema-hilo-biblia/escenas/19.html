<script>
const PARES = [
  ["“Se bloqueó el camino que llevaba al árbol de la vida”", "3:24", "“En las dos orillas del río había árboles de vida”", "22:2"],
  ["“De Edén salía un río que regaba el jardín”", "2:10", "“Un río de agua de vida […] que salía del trono de Dios”", "22:1"],
  ["La serpiente engaña: “De ningún modo morirán”", "3:4", "“El Diablo […] fue arrojado al lago de fuego”", "20:10"],
  ["“El suelo está maldito por tu culpa”", "3:17", "“Ya no habrá ninguna maldición”", "22:3"],
  ["“Polvo eres y al polvo volverás”", "3:19", "“La muerte ya no existirá”", "21:4"],
  ["“Se escondieron de la vista de Jehová Dios”", "3:8", "“La tienda de Dios está con la humanidad”", "21:3"],
  ["“Dios creó los cielos y la tierra”", "1:1", "“Un nuevo cielo y una nueva tierra”", "21:1"],
];
pinta(".filas", PARES.map(([a, ra, b, rb], i) => '<div class="fila f' + i + '"><div class="l">' + a + "<i>" + ra + '</i></div><div class="fl"><svg viewBox="0 0 90 30"><path class="hilo" d="M 6 15 L 70 15 M 58 4 L 76 15 L 58 26" style="stroke-width: 6"/></svg></div><div class="r">' + b + "<i>" + rb + "</i></div></div>").join(""));
entra(".cab", 0.3, { y: -10 });
entra(".hl", 0.4, { x: -30, y: 0 });
entra(".hr", 0.7, { x: 30, y: 0 });
const T = ["En Génesis se bloquea", "En Génesis, de Edén", "Allí la serpiente", "El suelo está maldito", "Polvo eres", "Adán y Eva se escondieron", "Y si la Biblia empieza"].map((p) => at(p));
const R = ["en las dos orillas", "un río de agua", "aquí es destruida", "ya no habrá ninguna", "la muerte ya no", "la tienda de Dios", "termina con"].map((p) => at(p));
T.forEach((t, i) => {
  entra(".f" + i + " .l", t, { x: -24, y: 0 });
  traza(".f" + i + " .hilo", R[i] - 0.6, 0.5);
  entra(".f" + i + " .r", R[i] - 0.1, { x: 24, y: 0 });
});
entra(".ncielo", at("un nuevo gobierno celestial"), { y: 12 });
atenua([".filas", ".ncielo"], at("Lo que se perdió"), 0.12, 0.5);
salta(".cierre", at("Lo que se perdió"), { desde: 0.9, ease: "power3.out" });
</script>
