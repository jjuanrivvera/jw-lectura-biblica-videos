.terra { color: var(--terra); }
.cielo { color: var(--cielo); }
.salvia { color: var(--salvia); }

.cab {
  position: absolute; left: 80px; right: 80px; top: 40px;
  display: flex; justify-content: space-between; align-items: baseline;

  color: var(--tenue); letter-spacing: 0.1em; text-transform: uppercase;
}
.cab .sec { color: var(--oro); }

/* Pie con la fuente. */
.fuente {
  position: absolute; left: 80px; right: 80px; bottom: 28px;

}
.fuente b, .fuente i { color: var(--papel); }
.fuente b { font-weight: 700; }

/* Columna de texto: el bloque activo se centra en el alto disponible. */

/* Registros: la Biblia, la anotación a mano, el texto de apoyo. */

.def { align-self: stretch; border: 3px solid rgba(243, 234, 216, 0.5); border-radius: 24px; padding: 24px 34px 28px;

.ilus { position: absolute; overflow: hidden; border-radius: 22px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); }

.ilus img { width: 100%; height: 100%; object-fit: cover; display: block; }

.pie-img i { color: var(--papel); }

.mapa .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

.trazo { fill: none; stroke: var(--papel); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.hilo { fill: none; stroke: var(--oro); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round;

// Filtro de tiza para los trazos: borde levemente irregular.
root.insertAdjacentHTML("afterbegin",
  '<svg width="0" height="0" style="position:absolute"><defs>' +

// Tarjeta de capítulo: "Jeremías 37" y su subtítulo.
function capitulo(x, t0, t1) {
  const c = el(x)[0];
  entra(c.querySelector(".num"), t0, { y: 60, d: 0.8 });
  escribe(c.querySelector(".sub"), t0 + 0.5, 0.9);
  traza(c.querySelectorAll("path"), t0 + 0.3, 0.8);
  if (c.querySelector(".edad")) entra(c.querySelector(".edad"), t0 + 0.9, { y: 20 });
  sale(c, t1, { y: -60, d: 0.6 });
}

// Entrada y salida de toda la escena: el fondo es común, solo se funde el contenido.
function marco() {
  tl.fromTo($(".contenido"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
  tl.to($(".contenido"), { opacity: 0, duration: 0.5, ease: "none" }, DUR - 0.55);
}

// Bloques de texto que se reemplazan en el mismo lugar: cada uno entra en su momento y sale
// justo antes del siguiente. Si `hasta` es null, el último se queda.
function secuencia(lista, hasta = null, o = {}) {
  lista.forEach(([s, t], i) => {
    entra(s, t, { y: o.y ?? 26, d: o.d ?? 0.55 });
    const sig = i < lista.length - 1 ? lista[i + 1][1] : hasta;
    if (sig != null) sale(s, sig - 0.4, { d: 0.35 });
  });
}
// Pone marcado SVG dentro de un elemento de la escena.
function pinta(sel, svg) { $(sel).innerHTML = svg; }

// ---------- mapas ----------
// Encuadre de cámara: lleva la región {x, y, w, h} de la imagen del mapa a la ventana
// {x, y, w, h} de la pantalla (relativa al contenedor .mapa), sin deformarla.
function encuadre(r, v) {
  const s = Math.min(v.w / r.w, v.h / r.h);
  return { scale: +s.toFixed(4), x: +(v.x + (v.w - r.w * s) / 2 - r.x * s).toFixed(1), y: +(v.y + (v.h - r.h * s) / 2 - r.y * s).toFixed(1) };
}
// Latido de un marcador: crece y vuelve, un número finito de veces.
function late(x, t, o = {}) {
  tl.fromTo(el(x), { scale: 1 }, { scale: o.s ?? 1.35, transformOrigin: "50% 50%", duration: o.d ?? 0.35, yoyo: true, repeat: o.n ?? 3, ease: "power1.inOut", immediateRender: false }, t);
}

// ---------- lecciones ----------
// Cada lección entra en su momento y sale antes de la siguiente; el número cuenta.
function lecciones(lista) {
  const cab = $(".seccion");
  if (cab) { entra(cab, 0.3, { y: -20 }); traza(".seccion-linea path", 0.6, 1.0); }
  secuencia(lista, null, { y: 30, d: 0.6 });
}

const GRUPOS = [

// Cinta de los 66 libros al pie: dice en qué parte del recorrido estamos (escenas 14 a 14e).
// Cada libro es una marca del color de su grupo; el grupo del que habla la voz se enciende y los demás se apagan.
// Requiere _libros.js y un <svg class="cinta66" viewBox="0 0 1920 120"></svg> en el marcado.
function cinta66() {
  const X0 = 110, X1 = 1810, PAS = (X1 - X0) / 66, Y = 30;
  let sv = '<line x1="' + X0 + '" y1="' + (Y + 26) + '" x2="' + X1 + '" y2="' + (Y + 26) + '" stroke="#ebbd5c" stroke-width="4" stroke-opacity="0.7"/>';
  LIBROS.forEach((l, i) => {
    const x = X0 + i * PAS + 2;
    sv += '<rect class="c66 c66g' + l[2] + ' c66-' + l[0] + '" x="' + x + '" y="' + Y + '" width="' + (PAS - 5) + '" height="52" rx="4" fill="' + GRUPOS[l[2]].c + '"/>';
  });
  GRUPOS.forEach((g, r) => {
    const libs = LIBROS.map((l, i) => [l, i]).filter(([l]) => l[2] === r);
    const xa = X0 + libs[0][1] * PAS, xb = X0 + (libs[libs.length - 1][1] + 1) * PAS;
    // Evangelios, Hechos y Apocalipsis son grupos angostos: su rótulo se alinea a un borde para no pisarse.
    const [xm, anc] = r === 4 ? [xb - 4, "end"] : r === 5 ? [xa + 2, "start"] : r === 7 ? [xb, "end"] : [(xa + xb) / 2, "middle"];
    sv += '<text class="c66t c66t' + r + '" x="' + xm + '" y="' + (Y + 86) + '" text-anchor="' + anc + '" font-family="Montserrat" font-weight="700" font-size="24" fill="' + g.c + '">' + g.n + '</text>';
  });
  $(".cinta66").innerHTML = sv;
  gsap.set($$(".c66, .c66t"), { opacity: 0.28 });
}
// Enciende los grupos indicados desde el instante t.
function focoCinta(grupos, t) {
  for (let r = 0; r < 8; r++) {
    const on = grupos.includes(r);
    tl.to($$(".c66g" + r + ", .c66t" + r), { opacity: on ? 1 : 0.28, duration: 0.5 }, t);
  }
}
