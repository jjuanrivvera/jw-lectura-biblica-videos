// Un objeto que recorre un trazo mientras se dibuja (Agar, los reyes, Abrán).
// Los puntos del camino se miden una sola vez al construir; durante el render solo se interpola.
function medirCamino(path, N = 400) {
  const p = sonda(el(path)[0]);
  const L = p.getTotalLength();
  const pts = [];
  for (let i = 0; i <= N; i++) { const q = p.getPointAtLength((L * i) / N); pts.push([q.x, q.y]); }
  p.remove();
  return pts;
}
function ponEnCamino(objs, pts, k) {
  const N = pts.length - 1;
  const f = Math.min(N, Math.max(0, k * N)), i = Math.floor(f), r = f - i, j = Math.min(N, i + 1);
  const x = pts[i][0] + (pts[j][0] - pts[i][0]) * r, y = pts[i][1] + (pts[j][1] - pts[i][1]) * r;
  objs.forEach((e) => e.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")"));
}
// Solo el primer recorrido de un objeto fija su posición inicial; los siguientes
// arrancan donde terminó el anterior.
const _colocados = new WeakSet();
function recorre(obj, path, t, d, o = {}) {
  const pts = typeof path === "string" || path instanceof Element ? medirCamino(path) : path;
  const objs = el(obj);
  const st = { k: o.desde ?? 0 };
  if (!objs.some((e) => _colocados.has(e))) { objs.forEach((e) => _colocados.add(e)); ponEnCamino(objs, pts, st.k); }
  tl.to(st, { k: o.hasta ?? 1, duration: d, ease: o.ease ?? "power1.inOut", onUpdate: () => ponEnCamino(objs, pts, st.k) }, t);
}
function cuenta(x, desde, hasta, t, d, fmt = (v) => Math.round(v).toString()) {
  const e = el(x)[0];
  const st = { v: desde };
  if (!_colocados.has(e)) { _colocados.add(e); e.textContent = fmt(desde); }
  tl.to(st, { v: hasta, duration: d, ease: "power1.out", onUpdate: () => (e.textContent = fmt(st.v)) }, t);
}
function camara(x, t, d, props, ease = "power2.inOut") {
  tl.to(el(x), { ...props, duration: d, ease }, t);
}
// Paneo lento sobre una ilustración (Ken Burns), sin salirse del marco.
function kb(x, t0, t1, desde, hasta) {
  tl.fromTo(el(x), { scale: desde.s ?? 1.08, xPercent: desde.x ?? 0, yPercent: desde.y ?? 0 },
    { scale: hasta.s ?? 1.0, xPercent: hasta.x ?? 0, yPercent: hasta.y ?? 0, duration: Math.max(0.1, t1 - t0), ease: "none" }, t0);
}
const fmtMiles = (v) => Math.round(v).toLocaleString("es-CO");

// ---------- piezas repetidas ----------
// Filtro de tiza para los trazos: borde levemente irregular.
root.insertAdjacentHTML("afterbegin",
  '<svg width="0" height="0" style="position:absolute"><defs>' +
  '<filter id="tz-' + ID + '" x="-5%" y="-5%" width="110%" height="110%">' +
  '<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>' +
  '<feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs></svg>');
const TIZA = "url(#tz-" + ID + ")";

// Tarjeta de capítulo: "Jeremías 37" y su subtítulo.
function capitulo(x, t0, t1) {
  const c = el(x)[0];
  entra(c.querySelector(".num"), t0, { y: 60, d: 0.8 });
  escribe(c.querySelector(".sub"), t0 + 0.5, 0.9);
  traza(c.querySelectorAll("path"), t0 + 0.3, 0.8);
  if (c.querySelector(".edad")) entra(c.querySelector(".edad"), t0 + 0.9, { y: 20 });
  sale(c, t1, { y: -60, d: 0.6 });
}

// Entrada y salida de toda la escena: el fondo es común, solo se funde el contenido.
function marco() {
  tl.fromTo($(".contenido"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
  tl.to($(".contenido"), { opacity: 0, duration: 0.5, ease: "none" }, DUR - 0.55);
}

// Bloques de texto que se reemplazan en el mismo lugar: cada uno entra en su momento y sale
// justo antes del siguiente. Si `hasta` es null, el último se queda.
function secuencia(lista, hasta = null, o = {}) {
  lista.forEach(([s, t], i) => {
    entra(s, t, { y: o.y ?? 26, d: o.d ?? 0.55 });
    const sig = i < lista.length - 1 ? lista[i + 1][1] : hasta;
    if (sig != null) sale(s, sig - 0.4, { d: 0.35 });
  });
}
// Pone marcado SVG dentro de un elemento de la escena.
function pinta(sel, svg) { $(sel).innerHTML = svg; }

// ---------- mapas ----------
// Encuadre de cámara: lleva la región {x, y, w, h} de la imagen del mapa a la ventana
// {x, y, w, h} de la pantalla (relativa al contenedor .mapa), sin deformarla.
function encuadre(r, v) {
  const s = Math.min(v.w / r.w, v.h / r.h);
  return { scale: +s.toFixed(4), x: +(v.x + (v.w - r.w * s) / 2 - r.x * s).toFixed(1), y: +(v.y + (v.h - r.h * s) / 2 - r.y * s).toFixed(1) };
}
// Latido de un marcador: crece y vuelve, un número finito de veces.
function late(x, t, o = {}) {
  tl.fromTo(el(x), { scale: 1 }, { scale: o.s ?? 1.35, transformOrigin: "50% 50%", duration: o.d ?? 0.35, yoyo: true, repeat: o.n ?? 3, ease: "power1.inOut", immediateRender: false }, t);
}

// ---------- lecciones ----------
// Cada lección entra en su momento y sale antes de la siguiente; el número cuenta.
function lecciones(lista) {
  const cab = $(".seccion");
  if (cab) { entra(cab, 0.3, { y: -20 }); traza(".seccion-linea path", 0.6, 1.0); }
  secuencia(lista, null, { y: 30, d: 0.6 });
}


// Los 66 libros: abreviatura, capítulos y grupo (TNM de estudio, "Tabla de los libros de la Biblia" y "Pregunta 19").
// Los colores de grupo evitan el oro, que en este video es solo la línea de la descendencia.
const LIBROS = [["Gé",50,0],["Éx",40,0],["Le",27,0],["Nú",36,0],["Dt",34,0],["Jos",24,1],["Jue",21,1],["Rut",4,1],["1Sa",31,1],["2Sa",24,1],["1Re",22,1],["2Re",25,1],["1Cr",29,1],["2Cr",36,1],["Esd",10,1],["Ne",13,1],["Est",10,1],["Job",42,2],["Sl",150,2],["Pr",31,2],["Ec",12,2],["Can",8,2],["Is",66,3],["Jer",52,3],["Lam",5,3],["Eze",48,3],["Da",12,3],["Os",14,3],["Joe",3,3],["Am",9,3],["Abd",1,3],["Jon",4,3],["Miq",7,3],["Na",3,3],["Hab",3,3],["Sof",3,3],["Ag",2,3],["Zac",14,3],["Mal",4,3],["Mt",28,4],["Mr",16,4],["Lu",24,4],["Jn",21,4],["Hch",28,5],["Ro",16,6],["1Co",16,6],["2Co",13,6],["Gál",6,6],["Ef",6,6],["Flp",4,6],["Col",4,6],["1Te",5,6],["2Te",3,6],["1Ti",6,6],["2Ti",4,6],["Tit",3,6],["Flm",1,6],["Heb",13,6],["Snt",5,6],["1Pe",5,6],["2Pe",3,6],["1Jn",5,6],["2Jn",1,6],["3Jn",1,6],["Jud",1,6],["Ap",22,7]];
const GRUPOS = [
  { n: "Pentateuco", c: "#a7b8cc" }, { n: "Históricos", c: "#94b8a6" }, { n: "Poéticos", c: "#b3a1d9" },
  { n: "Proféticos", c: "#cfa6c8" }, { n: "Evangelios", c: "#8fcfc4" }, { n: "Hechos", c: "#7fb2d9" },
  { n: "Cartas", c: "#9fa6ee" }, { n: "Apocalipsis", c: "#d6d9e0" },
];

// Cinta de los 66 libros al pie: dice en qué parte del recorrido estamos (escenas 14 a 14e).
// Cada libro es una marca del color de su grupo; el grupo del que habla la voz se enciende y los demás se apagan.
// Requiere _libros.js y un <svg class="cinta66" viewBox="0 0 1920 120"></svg> en el marcado.
function cinta66() {
  const X0 = 110, X1 = 1810, PAS = (X1 - X0) / 66, Y = 30;
  let sv = '<line x1="' + X0 + '" y1="' + (Y + 26) + '" x2="' + X1 + '" y2="' + (Y + 26) + '" stroke="#ebbd5c" stroke-width="4" stroke-opacity="0.7"/>';
  LIBROS.forEach((l, i) => {
    const x = X0 + i * PAS + 2;
    sv += '<rect class="c66 c66g' + l[2] + ' c66-' + l[0] + '" x="' + x + '" y="' + Y + '" width="' + (PAS - 5) + '" height="52" rx="4" fill="' + GRUPOS[l[2]].c + '"/>';
  });
  GRUPOS.forEach((g, r) => {
    const libs = LIBROS.map((l, i) => [l, i]).filter(([l]) => l[2] === r);
    const xa = X0 + libs[0][1] * PAS, xb = X0 + (libs[libs.length - 1][1] + 1) * PAS;
    // Evangelios, Hechos y Apocalipsis son grupos angostos: su rótulo se alinea a un borde para no pisarse.
    const [xm, anc] = r === 4 ? [xb - 4, "end"] : r === 5 ? [xa + 2, "start"] : r === 7 ? [xb, "end"] : [(xa + xb) / 2, "middle"];
    sv += '<text class="c66t c66t' + r + '" x="' + xm + '" y="' + (Y + 86) + '" text-anchor="' + anc + '" font-family="Montserrat" font-weight="700" font-size="24" fill="' + g.c + '">' + g.n + '</text>';
  });
  $(".cinta66").innerHTML = sv;
  gsap.set($$(".c66, .c66t"), { opacity: 0.28 });
}
// Enciende los grupos indicados desde el instante t.
function focoCinta(grupos, t) {
  for (let r = 0; r < 8; r++) {
    const on = grupos.includes(r);
    tl.to($$(".c66g" + r + ", .c66t" + r), { opacity: on ? 1 : 0.28, duration: 0.5 }, t);
  }
}

cinta66();
const tB = at("Ese es el recorrido") - 0.3;
entra(".cab", 0.3, { y: -10 });
entra(".cinta66", 0.4, { y: 20 });
focoCinta([7], 0.8);
entra(".juan", 0.4, { y: 30 });
kb(".juan .kb", 0.4, tB, { s: 1.0 }, { s: 1.07 });
entra(".ficha", 0.8, { y: 20 });
entra(".tema", at("Su tema es"), { y: 20 });
gsap.set($(".c129"), { opacity: 0 });
entra(".c129", at("la serpiente original"), { y: 16 });
tl.to($(".fa"), { opacity: 0, duration: 0.5 }, tB);
desaparece(".cinta66", tB, 0.5);

// El recorrido: los 66 libros por grupos, con el hilo de oro que los cose de Génesis a Apocalipsis.
const BX = 290, TAM = 64, PAS = 70, Y0 = 120, FIL = 88;
let sv = "", centros = [];
GRUPOS.forEach((g, r) => {
  const y = Y0 + r * FIL, libs = LIBROS.filter((l) => l[2] === r);
  sv += '<g class="fila fila' + r + '"><text x="262" y="' + (y + 42) + '" text-anchor="end" font-size="30" font-weight="800" fill="' + g.c + '">' + g.n + '</text>';
  libs.forEach((l, k) => {
    const x = BX + k * PAS;
    sv += '<rect x="' + x + '" y="' + y + '" width="' + TAM + '" height="' + TAM + '" rx="9" fill="' + g.c + '" fill-opacity="0.9"/>' +
      '<text x="' + (x + TAM / 2) + '" y="' + (y + 42) + '" text-anchor="middle" font-size="25" font-weight="800" fill="#10162a">' + l[0] + '</text>';
    centros.push([x + TAM / 2, y + TAM / 2]);
  });
  sv += "</g>";
});
// El hilo es el lomo: una espina vertical de oro a la izquierda y un ramal bajo cada fila.
const XE = 280, ys = GRUPOS.map((g, r) => Y0 + r * FIL + TAM + 8);
sv += '<path class="hilo h66 esp" d="M ' + XE + ' ' + (Y0 - 6) + ' L ' + XE + ' ' + ys[7] + '" style="stroke-width: 6" />';
GRUPOS.forEach((g, r) => {
  const n = LIBROS.filter((l) => l[2] === r).length;
  sv += '<path class="hilo h66 ram ram' + r + '" d="M ' + XE + ' ' + ys[r] + ' L ' + (BX + (n - 1) * PAS + TAM) + ' ' + ys[r] + '" style="stroke-width: 5" />';
});
$(".mapa66").innerHTML = sv;

aparece(".fb", tB + 0.1, 0.3);
const filas = [[0, "Cinco libros que plantean"], [1, "Doce que siguen"], [2, "Cinco poéticos"], [3, "Diecisiete proféticos"], [4, "Cuatro Evangelios"], [5, "Hechos, que lleva"], [6, "Veintiuna cartas"], [7, "Y Apocalipsis, que cierra"]];
filas.forEach(([r, f]) => entra(".fila" + r, at(f, tB) - 0.1, { x: -30, y: 0, d: 0.5 }));
traza(".esp", at("Cinco libros que plantean", tB) - 0.2, at("Y Apocalipsis, que cierra", tB) - at("Cinco libros que plantean", tB) + 0.8, { ease: "none" });
filas.forEach(([r, f]) => traza(".ram" + r, at(f, tB) + 0.3, 1.2, { ease: "power1.out" }));
entra(".lema", at("Sesenta y seis libros, un solo"), { y: 20 });

marco();
window.__timelines[ID] = tl;
})();
</script>
