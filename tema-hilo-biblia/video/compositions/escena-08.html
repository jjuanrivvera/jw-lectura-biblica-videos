}
function desaparece(x, t, d = 0.45) {
  tl.to(el(x), { opacity: 0, duration: d, ease: "none" }, t);
}
function salta(x, t, o = {}) {
  tl.fromTo(inicial(el(x), { opacity: 0 }), { opacity: 0, scale: o.desde ?? 0.4, rotation: o.r ?? 0 },
    { opacity: 1, scale: 1, rotation: 0, duration: o.d ?? 0.55, ease: o.ease ?? "back.out(1.8)", stagger: o.st ?? 0, ...IR }, t);
}
// Escritura a mano: se descubre de izquierda a derecha, como si la tiza avanzara.
function escribe(x, t, d = 0.8, o = {}) {
  tl.fromTo(inicial(el(x), { clipPath: "inset(-30% 103% -30% -3%)" }), { opacity: 1, clipPath: "inset(-30% 103% -30% -3%)" },
    { clipPath: "inset(-30% -3% -30% -3%)", opacity: 1, duration: d, ease: "none", stagger: o.st ?? 0, ...IR }, t);
}
// Trazo de tiza: la línea se dibuja en vivo.
const _largos = new Map();
// Las escenas que no están en pantalla al cargar están ocultas, y ahí getTotalLength()
// devuelve 0. Se mide una copia del trazo dentro de un SVG auxiliar que sí se dibuja.
function sonda(p) {
  let s = document.getElementById("sonda-trazos");
  if (!s) {
    s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.id = "sonda-trazos";
    s.setAttribute("style", "position:fixed;left:0;top:0;width:10px;height:10px;visibility:hidden;pointer-events:none");
    document.body.appendChild(s);
  }
  const c = p.cloneNode(false);
  s.appendChild(c);
  return c;
}
function largo(p) {
  const c = sonda(p);
  const L = c.getTotalLength();
  c.remove();
  return L;
}
function preparaTrazos(x) {
  el(x).forEach((p) => {
    if (_largos.has(p)) return;
    const L = largo(p);
    _largos.set(p, L);
    p.style.strokeDasharray = L + " " + (L + 2);
    p.style.strokeDashoffset = L;
  });
}
function traza(x, t, d = 1, o = {}) {
  const ps = inicial(el(x), { opacity: 0 });
  preparaTrazos(ps);
  tl.fromTo(ps, { strokeDashoffset: (i, p) => _largos.get(p), opacity: 1 },
    { strokeDashoffset: 0, opacity: 1, duration: d, ease: o.ease ?? "power1.inOut", stagger: o.st ?? 0, ...IR }, t);
}
// Un objeto que recorre un trazo mientras se dibuja (Agar, los reyes, Abrán).
// Los puntos del camino se miden una sola vez al construir; durante el render solo se interpola.
function medirCamino(path, N = 400) {
  const p = sonda(el(path)[0]);
  const L = p.getTotalLength();
  const pts = [];
  for (let i = 0; i <= N; i++) { const q = p.getPointAtLength((L * i) / N); pts.push([q.x, q.y]); }
  p.remove();
  return pts;
}
function ponEnCamino(objs, pts, k) {
  const N = pts.length - 1;
  const f = Math.min(N, Math.max(0, k * N)), i = Math.floor(f), r = f - i, j = Math.min(N, i + 1);
  const x = pts[i][0] + (pts[j][0] - pts[i][0]) * r, y = pts[i][1] + (pts[j][1] - pts[i][1]) * r;
  objs.forEach((e) => e.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")"));
}
// Solo el primer recorrido de un objeto fija su posición inicial; los siguientes
// arrancan donde terminó el anterior.
const _colocados = new WeakSet();
function recorre(obj, path, t, d, o = {}) {
  const pts = typeof path === "string" || path instanceof Element ? medirCamino(path) : path;
  const objs = el(obj);
  const st = { k: o.desde ?? 0 };
  if (!objs.some((e) => _colocados.has(e))) { objs.forEach((e) => _colocados.add(e)); ponEnCamino(objs, pts, st.k); }
  tl.to(st, { k: o.hasta ?? 1, duration: d, ease: o.ease ?? "power1.inOut", onUpdate: () => ponEnCamino(objs, pts, st.k) }, t);
}
function cuenta(x, desde, hasta, t, d, fmt = (v) => Math.round(v).toString()) {
  const e = el(x)[0];
  const st = { v: desde };
  if (!_colocados.has(e)) { _colocados.add(e); e.textContent = fmt(desde); }
  tl.to(st, { v: hasta, duration: d, ease: "power1.out", onUpdate: () => (e.textContent = fmt(st.v)) }, t);
}
function camara(x, t, d, props, ease = "power2.inOut") {
  tl.to(el(x), { ...props, duration: d, ease }, t);
}
// Paneo lento sobre una ilustración (Ken Burns), sin salirse del marco.
function kb(x, t0, t1, desde, hasta) {
  tl.fromTo(el(x), { scale: desde.s ?? 1.08, xPercent: desde.x ?? 0, yPercent: desde.y ?? 0 },
    { scale: hasta.s ?? 1.0, xPercent: hasta.x ?? 0, yPercent: hasta.y ?? 0, duration: Math.max(0.1, t1 - t0), ease: "none" }, t0);
}
const fmtMiles = (v) => Math.round(v).toLocaleString("es-CO");

// ---------- piezas repetidas ----------
// Filtro de tiza para los trazos: borde levemente irregular.
root.insertAdjacentHTML("afterbegin",
  '<svg width="0" height="0" style="position:absolute"><defs>' +
  '<filter id="tz-' + ID + '" x="-5%" y="-5%" width="110%" height="110%">' +
  '<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>' +
  '<feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs></svg>');
const TIZA = "url(#tz-" + ID + ")";

// Tarjeta de capítulo: "Jeremías 37" y su subtítulo.
function capitulo(x, t0, t1) {
  const c = el(x)[0];
  entra(c.querySelector(".num"), t0, { y: 60, d: 0.8 });
  escribe(c.querySelector(".sub"), t0 + 0.5, 0.9);
  traza(c.querySelectorAll("path"), t0 + 0.3, 0.8);
  if (c.querySelector(".edad")) entra(c.querySelector(".edad"), t0 + 0.9, { y: 20 });
  sale(c, t1, { y: -60, d: 0.6 });
}

// Entrada y salida de toda la escena: el fondo es común, solo se funde el contenido.
function marco() {
  tl.fromTo($(".contenido"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
  tl.to($(".contenido"), { opacity: 0, duration: 0.5, ease: "none" }, DUR - 0.55);
}

// Bloques de texto que se reemplazan en el mismo lugar: cada uno entra en su momento y sale
// justo antes del siguiente. Si `hasta` es null, el último se queda.
function secuencia(lista, hasta = null, o = {}) {
  lista.forEach(([s, t], i) => {
    entra(s, t, { y: o.y ?? 26, d: o.d ?? 0.55 });
    const sig = i < lista.length - 1 ? lista[i + 1][1] : hasta;
    if (sig != null) sale(s, sig - 0.4, { d: 0.35 });
  });
}
// Pone marcado SVG dentro de un elemento de la escena.
function pinta(sel, svg) { $(sel).innerHTML = svg; }

// ---------- mapas ----------
// Encuadre de cámara: lleva la región {x, y, w, h} de la imagen del mapa a la ventana
// {x, y, w, h} de la pantalla (relativa al contenedor .mapa), sin deformarla.
function encuadre(r, v) {
  const s = Math.min(v.w / r.w, v.h / r.h);
  return { scale: +s.toFixed(4), x: +(v.x + (v.w - r.w * s) / 2 - r.x * s).toFixed(1), y: +(v.y + (v.h - r.h * s) / 2 - r.y * s).toFixed(1) };
}
// Latido de un marcador: crece y vuelve, un número finito de veces.
function late(x, t, o = {}) {
  tl.fromTo(el(x), { scale: 1 }, { scale: o.s ?? 1.35, transformOrigin: "50% 50%", duration: o.d ?? 0.35, yoyo: true, repeat: o.n ?? 3, ease: "power1.inOut", immediateRender: false }, t);
}

// ---------- lecciones ----------
// Cada lección entra en su momento y sale antes de la siguiente; el número cuenta.
function lecciones(lista) {
  const cab = $(".seccion");
  if (cab) { entra(cab, 0.3, { y: -20 }); traza(".seccion-linea path", 0.6, 1.0); }
  secuencia(lista, null, { y: 30, d: 0.6 });
}


// La línea de la descendencia como una franja de oro que se estrecha hasta una sola persona y se vuelve a abrir.
// Se dibuja grande en la escena 06 y como cinta de "dónde estamos" en las escenas 07 a 11.
const NODOS = [["la mujer", 0.03], ["Abrahán", 0.19], ["Isaac", 0.28], ["Jacob", 0.37], ["Judá", 0.47],
  ["David", 0.58], ["Jesús", 0.72], ["144.000", 0.85], ["las naciones", 0.97]];
const ANGOSTO = 0.72;
function mitadEn(f, mitad) {
  const m = f < ANGOSTO ? Math.pow(1 - f / ANGOSTO, 1.25) : Math.pow((f - ANGOSTO) / (1 - ANGOSTO), 0.9);
  return Math.max(4, mitad * (0.03 + 0.97 * m));
}
// Devuelve el marcado SVG de la franja, sus puntos y (si se pide) los rótulos. Prefijo de clases: "em".
function embudo(o) {
  const { x0, w, cy, mitad, id = "em", fs = 30, rotulos = "abajo" } = o;
  const N = 140, sup = [], inf = [];
  for (let i = 0; i <= N; i++) {
    const f = i / N, x = x0 + f * w, h = mitadEn(f, mitad);
    sup.push(x.toFixed(1) + " " + (cy - h).toFixed(1));
    inf.push(x.toFixed(1) + " " + (cy + h).toFixed(1));
  }
  const d = "M " + sup.join(" L ") + " L " + inf.reverse().join(" L ") + " Z";
  let s = '<defs><linearGradient id="' + id + '-g" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#f6d98f" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ebbd5c" stop-opacity="0.85"/>' +
    '<stop offset="1" stop-color="#c8963a" stop-opacity="0.55"/></linearGradient>' +
    '<clipPath id="' + id + '-c"><rect class="' + id + '-rev" x="' + (x0 - 20) + '" y="' + (cy - mitad - 60) + '" width="0" height="' + (2 * mitad + 120) + '"/></clipPath></defs>' +
    '<path d="' + d + '" fill="#ebbd5c" fill-opacity="0.07" stroke="#ebbd5c" stroke-opacity="0.18" stroke-width="2"/>' +
    '<g clip-path="url(#' + id + '-c)"><path d="' + d + '" fill="url(#' + id + '-g)" stroke="#f6d98f" stroke-width="2" stroke-opacity="0.6"/>' +
    '<path d="M ' + x0 + ' ' + cy + ' L ' + (x0 + w) + ' ' + cy + '" stroke="#10162a" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 10"/></g>';
  NODOS.forEach(([n, f], i) => {
    const x = x0 + f * w;
    s += '<g class="' + id + '-n ' + id + '-n' + i + '">';
    s += '<circle cx="' + x.toFixed(1) + '" cy="' + cy + '" r="' + (fs * 0.42).toFixed(1) + '" fill="#10162a" stroke="#f6d98f" stroke-width="4"/>';
    if (rotulos === "abajo") {
      const yb = cy + mitad + fs * 1.6;
      s += '<path d="M ' + x.toFixed(1) + ' ' + (cy + fs * 0.5).toFixed(1) + ' L ' + x.toFixed(1) + ' ' + (yb - fs * 1.05).toFixed(1) + '" stroke="#f3ead8" stroke-opacity="0.35" stroke-width="2"/>';
      s += '<text x="' + x.toFixed(1) + '" y="' + yb.toFixed(1) + '" text-anchor="middle" font-family="Montserrat" font-weight="700" font-size="' + fs + '" fill="#f3ead8">' + n + '</text>';
    } else if (rotulos === "arriba") {
      s += '<text class="' + id + '-t" x="' + x.toFixed(1) + '" y="' + (cy - mitad - fs * 0.6).toFixed(1) + '" text-anchor="middle" font-family="Montserrat" font-weight="700" font-size="' + fs + '" fill="#aab4c8">' + n + '</text>';
    }
    s += "</g>";
  });
  return s;
}
// x de un nodo (por nombre) para alinear otras piezas.
function xNodo(o, nombre) { return o.x0 + NODOS.find((n) => n[0] === nombre)[1] * o.w; }
// Cinta pequeña al pie de las escenas 07 a 11: la franja entera, el nodo activo encendido.
function cinta(sel, activos) {
  const o = { x0: 110, w: 1700, cy: 1000, mitad: 34, id: "ci" + ID.replace(/\W/g, ""), fs: 24, rotulos: "arriba" };
  pinta(sel, '<svg viewBox="0 0 1920 1080" style="position:absolute;inset:0;width:1920px;height:1080px">' + embudo(o) + "</svg>");
  gsap.set($(sel + " ." + o.id + "-rev"), { attr: { width: o.w + 40 } });
  activos.forEach((n) => {
    const i = NODOS.findIndex((x) => x[0] === n);
    const t = $(sel + " ." + o.id + "-n" + i + " text");
    t.setAttribute("fill", "#f6d98f");
    t.setAttribute("font-size", "28");
  });
}

cinta(".cint", ["Jacob"]);
// Vidas que se solapan (años de Génesis 5, 9, 11 y 25, contados desde la creación de Adán en 4026 a. e. c.).
const AX = (a) => 160 + (4100 - a) * 0.62;
const VIDAS = [["Adán", 4026, 3096, "930 años"], ["Lamec, padre de Noé", 3152, 2375, "777 años"], ["Sem, hijo de Noé", 2468, 1868, "600 años"], ["Abrahán", 2018, 1843, "175 años"]];
let sv = '<path class="trazo eje" d="M ' + AX(4100) + ' 520 L ' + AX(1450) + ' 520" style="stroke: var(--tenue); stroke-width: 3" />';
[4000, 3000, 2000].forEach((a) => {
  sv += '<g class="tk"><path d="M ' + AX(a) + ' 512 V 528" stroke="#aab4c8" stroke-width="3"/><text x="' + AX(a) + '" y="565" text-anchor="middle" font-size="26" font-weight="600" fill="#aab4c8">' + a + ' a. e. c.</text></g>';
});
VIDAS.forEach(([n, a, b, e], i) => {
  const y = 40 + i * 112;
  sv += '<g class="vd vd' + i + '"><rect x="' + AX(a) + '" y="' + y + '" width="' + (AX(b) - AX(a)) + '" height="62" rx="12" fill="rgba(243,234,216,0.16)" stroke="#f3ead8" stroke-width="3"/>' +
    (AX(b) - AX(a) > 300 ? '<text x="' + (AX(a) + 20) + '" y="' + (y + 42) + '" font-size="32" font-weight="700" fill="#f3ead8">' + n + '</text>'
      : '<text x="' + (AX(a) - 18) + '" y="' + (y + 42) + '" text-anchor="end" font-size="32" font-weight="700" fill="#f3ead8">' + n + '</text>') +
    '<text x="' + (AX(b) + 16) + '" y="' + (y + 42) + '" font-size="26" font-weight="500" fill="#aab4c8">' + e + '</text></g>';
});
// Solapes: la promesa pasa de una vida a la siguiente.
[[3152, 3096, 0], [2468, 2375, 1], [2018, 1868, 2]].forEach(([a, b, i]) => {
  const y = 40 + i * 112;
  sv += '<rect class="so so' + i + '" x="' + AX(a) + '" y="' + y + '" width="' + (AX(b) - AX(a)) + '" height="174" rx="8" fill="rgba(235,189,92,0.35)" stroke="#f6d98f" stroke-width="3"/>';
});
sv += '<text class="nota" x="' + AX(1450) + '" y="14" text-anchor="end" font-size="24" fill="#aab4c8">Solapes: El Reino de Dios ya está gobernando, cap. 3, pág. 33, nota</text>';
sv += '<g class="tk tkb"><path d="M ' + AX(1513) + ' 500 V 540" stroke="#8fb9f2" stroke-width="5"/><text x="' + (AX(1513) + 12) + '" y="482" text-anchor="end" font-size="26" font-weight="800" fill="#8fb9f2">1513: la Biblia escrita</text></g>';
$(".vidas").innerHTML = sv;

const tB = at("Por la Ley") - 0.3;
entra(".cab", 0.3, { y: -10 });
aparece([".cintap", ".cint"], 0.2, 0.5);
entra(".encab .anio", 0.4, { y: 30 });
entra(".e1", at("hizo el pacto de la Ley"), { y: 14 });
entra(".e2", at("Moisés terminó"), { y: 14 });
escribe(".boca", at("Hasta entonces"), 1.0);
traza(".eje", 1.6, 1.0);
aparece(".tk", 2.0, 0.5);
[["La vida de Adán", 0], ["con la de Lamec", 1], ["la de Lamec", 1], ["con la de Sem", 2], ["con la de Abrahán", 3]].forEach(([p, i], k) => {
  if (k === 2) return;
  entra(".vd" + i, at(p) - 0.1, { x: -30, y: 0 });
});
aparece(".so0", at("con la de Lamec") + 0.4, 0.4);
aparece(".so1", at("con la de Sem") + 0.4, 0.4);
aparece(".so2", at("con la de Abrahán") + 0.4, 0.4);
aparece(".nota", at("con la de Abrahán") + 0.8, 0.4);
tl.to($(".fa"), { opacity: 0, duration: 0.5 }, tB);
aparece(".fb", tB + 0.1, 0.4);
entra(".fb .cita", tB + 0.2, { y: 24 });
entra([".u1", ".u2", ".u3"], at("cumplió tres funciones"), { y: 30, st: 0.3 });
atenua([".u2", ".u3"], at("cumplió tres funciones") + 1.2, 0.4);
tl.to($(".u2"), { opacity: 1, duration: 0.4 }, at("Con sus sacrificios"));
tl.to($(".u3"), { opacity: 1, duration: 0.4 }, at("Y fue, como dice Pablo"));
entra(".fb .fuente", at("Fue como un muro") + 0.5, { y: 10 });

marco();
window.__timelines[ID] = tl;
})();
</script>
