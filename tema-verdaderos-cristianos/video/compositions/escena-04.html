  tl.fromTo(el(x), { scale: 1 }, { scale: o.s ?? 1.35, transformOrigin: "50% 50%", duration: o.d ?? 0.35, yoyo: true, repeat: o.n ?? 3, ease: "power1.inOut", immediateRender: false }, t);
}

// ---------- lecciones ----------
// Cada lección entra en su momento y sale antes de la siguiente; el número cuenta.
function lecciones(lista) {
  const cab = $(".seccion");
  if (cab) { entra(cab, 0.3, { y: -20 }); traza(".seccion-linea path", 0.6, 1.0); }
  secuencia(lista, null, { y: 30, d: 0.6 });
}

// ---------- piezas de Génesis 42 al 47 que siguen sirviendo ----------
// "Empieza centrado y sube": el envoltorio arranca desplazado y sube cuando llega lo siguiente.
// Se mueve el envoltorio, no el bloque, para no pelear con entra().
function centra(x, y0, t1, d = 0.8) {
  tl.set(el(x), { y: y0 }, 0);
  tl.to(el(x), { y: 0, duration: d, ease: "power2.inOut" }, t1);
}
// Cámara que acompaña a un viajero: en cada cuadro centra el punto k del camino en la ventana V,
// mostrando una región de `ancho` px de la imagen. Los puntos ya vienen medidos (medirCamino).
function sigueCamino(cam, pts, t0, d, V, ancho, o = {}) {
  const c = el(cam)[0];
  const st = { k: o.desde ?? 0 };
  const N = pts.length - 1, alto = (ancho * V.h) / V.w;
  const cx = o.cx ?? 0.5, cy = o.cy ?? 0.5;
  const pon = (k) => {
    const [x, y] = pts[Math.min(N, Math.max(0, Math.round(k * N)))];
    gsap.set(c, encuadre({ x: x - ancho * cx, y: y - alto * cy, w: ancho, h: alto }, V));
  };
  tl.to(st, { k: o.hasta ?? 1, duration: d, ease: o.ease ?? "power1.inOut", onUpdate: () => pon(st.k) }, t0);
}

// ---------- las seis señales ----------
// Orden de Qué enseña la Biblia, cap. 15; el color de cada una se repite en todo el video.

// Marcado del índice: activa = número de la señal encendida (0 = ninguna).
function indiceHTML(activa = 0, o = {}) {
  return SENALES.map((t, i) => `<div class="ch c${i + 1} ch${i + 1}${i + 1 === activa ? " on" : ""}"><div class="n">${i + 1}</div><div class="t">${o.cortos ? o.cortos[i] : t}</div></div>`).join("");
}

function cabSenal(n, t) {

}


// Billete dibujado: guilloches, medallón con el árbol como marca de agua, hilo, relieve y tinta que cambia.
function billete(p, completo) {
  let g = "";
  for (let i = 0; i < 26; i++) g += `<ellipse cx="300" cy="270" rx="${60 + i * 9}" ry="${30 + i * 6}" fill="none" stroke="${completo ? "#7f9c7a" : "#8f8f8a"}" stroke-width="1.6" opacity="0.5"/>`;
  for (let i = 0; i < 18; i++) g += `<ellipse cx="860" cy="270" rx="${40 + i * 8}" ry="${70 + i * 7}" fill="none" stroke="${completo ? "#b09a5c" : "#9a9a95"}" stroke-width="1.4" opacity="0.45"/>`;
  const fondo = completo ? `url(#${p}-bg)` : "#c9c7bf";
  return `<defs><linearGradient id="${p}-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7e2c8"/><stop offset="0.5" stop-color="#d6dcc0"/><stop offset="1" stop-color="#e3d6b0"/></linearGradient>
    <linearGradient id="${p}-tinta" x1="0" x2="1"><stop offset="0" stop-color="#2f7d6a"/><stop offset="1" stop-color="#7a4fa0"/></linearGradient>
    <clipPath id="${p}-clip"><rect x="0" y="0" width="1100" height="540" rx="28"/></clipPath></defs>
    <g clip-path="url(#${p}-clip)"><rect x="0" y="0" width="1100" height="540" fill="${fondo}"/>${g}
    <rect x="30" y="30" width="1040" height="480" rx="18" fill="none" stroke="${completo ? "#5f7f5a" : "#8a8a85"}" stroke-width="6"/>
    <rect x="46" y="46" width="1008" height="448" rx="12" fill="none" stroke="${completo ? "#5f7f5a" : "#8a8a85"}" stroke-width="2"/></g>
    <rect x="0" y="0" width="1100" height="540" rx="28" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="3"/>`;
}
