  const p = sonda(el(path)[0]);
  const L = p.getTotalLength();
  const pts = [];
  for (let i = 0; i <= N; i++) { const q = p.getPointAtLength((L * i) / N); pts.push([q.x, q.y]); }
  p.remove();
  return pts;
}
function ponEnCamino(objs, pts, k) {
  const N = pts.length - 1;
  const f = Math.min(N, Math.max(0, k * N)), i = Math.floor(f), r = f - i, j = Math.min(N, i + 1);
  const x = pts[i][0] + (pts[j][0] - pts[i][0]) * r, y = pts[i][1] + (pts[j][1] - pts[i][1]) * r;
  objs.forEach((e) => e.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")"));
}
// Solo el primer recorrido de un objeto fija su posición inicial; los siguientes
// arrancan donde terminó el anterior.
const _colocados = new WeakSet();
function recorre(obj, path, t, d, o = {}) {
  const pts = typeof path === "string" || path instanceof Element ? medirCamino(path) : path;
  const objs = el(obj);
  const st = { k: o.desde ?? 0 };
  if (!objs.some((e) => _colocados.has(e))) { objs.forEach((e) => _colocados.add(e)); ponEnCamino(objs, pts, st.k); }
  tl.to(st, { k: o.hasta ?? 1, duration: d, ease: o.ease ?? "power1.inOut", onUpdate: () => ponEnCamino(objs, pts, st.k) }, t);
}
function cuenta(x, desde, hasta, t, d, fmt = (v) => Math.round(v).toString()) {
  const e = el(x)[0];
  const st = { v: desde };
  if (!_colocados.has(e)) { _colocados.add(e); e.textContent = fmt(desde); }
  tl.to(st, { v: hasta, duration: d, ease: "power1.out", onUpdate: () => (e.textContent = fmt(st.v)) }, t);
}
function camara(x, t, d, props, ease = "power2.inOut") {
  tl.to(el(x), { ...props, duration: d, ease }, t);
}
// Paneo lento sobre una ilustración (Ken Burns), sin salirse del marco.
function kb(x, t0, t1, desde, hasta) {
  tl.fromTo(el(x), { scale: desde.s ?? 1.08, xPercent: desde.x ?? 0, yPercent: desde.y ?? 0 },
    { scale: hasta.s ?? 1.0, xPercent: hasta.x ?? 0, yPercent: hasta.y ?? 0, duration: Math.max(0.1, t1 - t0), ease: "none" }, t0);
}
const fmtMiles = (v) => Math.round(v).toLocaleString("es-CO");

// ---------- piezas repetidas ----------
// Filtro de tiza para los trazos: borde levemente irregular.
root.insertAdjacentHTML("afterbegin",

// Tarjeta de capítulo: "Jeremías 37" y su subtítulo.
function capitulo(x, t0, t1) {

// Entrada y salida de toda la escena: el fondo es común, solo se funde el contenido.
function marco() {
  tl.fromTo($(".contenido"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
  tl.to($(".contenido"), { opacity: 0, duration: 0.5, ease: "none" }, DUR - 0.55);
}

// Bloques de texto que se reemplazan en el mismo lugar: cada uno entra en su momento y sale
// justo antes del siguiente. Si `hasta` es null, el último se queda.
function secuencia(lista, hasta = null, o = {}) {
  lista.forEach(([s, t], i) => {
    entra(s, t, { y: o.y ?? 26, d: o.d ?? 0.55 });
    const sig = i < lista.length - 1 ? lista[i + 1][1] : hasta;
    if (sig != null) sale(s, sig - 0.4, { d: 0.35 });
  });
}
// Pone marcado SVG dentro de un elemento de la escena.
function pinta(sel, svg) { $(sel).innerHTML = svg; }

// ---------- mapas ----------
// Encuadre de cámara: lleva la región {x, y, w, h} de la imagen del mapa a la ventana
// {x, y, w, h} de la pantalla (relativa al contenedor .mapa), sin deformarla.
function encuadre(r, v) {
  const s = Math.min(v.w / r.w, v.h / r.h);
  return { scale: +s.toFixed(4), x: +(v.x + (v.w - r.w * s) / 2 - r.x * s).toFixed(1), y: +(v.y + (v.h - r.h * s) / 2 - r.y * s).toFixed(1) };
}
// Latido de un marcador: crece y vuelve, un número finito de veces.
function late(x, t, o = {}) {
  tl.fromTo(el(x), { scale: 1 }, { scale: o.s ?? 1.35, transformOrigin: "50% 50%", duration: o.d ?? 0.35, yoyo: true, repeat: o.n ?? 3, ease: "power1.inOut", immediateRender: false }, t);
}

// ---------- lecciones ----------
// Cada lección entra en su momento y sale antes de la siguiente; el número cuenta.
function lecciones(lista) {
  const cab = $(".seccion");
  if (cab) { entra(cab, 0.3, { y: -20 }); traza(".seccion-linea path", 0.6, 1.0); }
  secuencia(lista, null, { y: 30, d: 0.6 });
}

// ---------- piezas de Génesis 42 al 47 que siguen sirviendo ----------
// "Empieza centrado y sube": el envoltorio arranca desplazado y sube cuando llega lo siguiente.
// Se mueve el envoltorio, no el bloque, para no pelear con entra().
function centra(x, y0, t1, d = 0.8) {
  tl.set(el(x), { y: y0 }, 0);
  tl.to(el(x), { y: 0, duration: d, ease: "power2.inOut" }, t1);
}
// Cámara que acompaña a un viajero: en cada cuadro centra el punto k del camino en la ventana V,
// mostrando una región de `ancho` px de la imagen. Los puntos ya vienen medidos (medirCamino).
function sigueCamino(cam, pts, t0, d, V, ancho, o = {}) {
  const c = el(cam)[0];
  const st = { k: o.desde ?? 0 };
  const N = pts.length - 1, alto = (ancho * V.h) / V.w;
  const cx = o.cx ?? 0.5, cy = o.cy ?? 0.5;
  const pon = (k) => {
    const [x, y] = pts[Math.min(N, Math.max(0, Math.round(k * N)))];
    gsap.set(c, encuadre({ x: x - ancho * cx, y: y - alto * cy, w: ancho, h: alto }, V));
  };
  tl.to(st, { k: o.hasta ?? 1, duration: d, ease: o.ease ?? "power1.inOut", onUpdate: () => pon(st.k) }, t0);
}

// ---------- las seis señales ----------
// Orden de Qué enseña la Biblia, cap. 15; el color de cada una se repite en todo el video.
const SENALES = ["Se guían por la Biblia", "Dan a conocer el nombre de Dios", "Se aman unos a otros",

// Marcado del índice: activa = número de la señal encendida (0 = ninguna).
function indiceHTML(activa = 0, o = {}) {

}
// Cabecera de escena de señal: "SEÑAL 3" y el nombre, con su trazo.
function cabSenal(n, t) {

// Árboles de Mateo 7:17, 18: uno bueno con frutos y uno seco. Se usan en la escena 03 (la prueba) y en la 16
// (las seis señales juntas). Coordenadas en una caja de 600x720; el pie del tronco está en (300, 700).
const COPA = [[300, 250, 175], [175, 315, 125], [425, 315, 125], [225, 175, 115], [375, 175, 115], [300, 120, 105], [300, 360, 120]];
// Huecos para frutos dentro de la copa (en orden de aparición).
const HUECOS = [[205, 300], [395, 290], [300, 190], [250, 395], [365, 395], [300, 300]];
function arbolDefs(p) {
  return `<defs>
  <linearGradient id="${p}-tronco" x1="0" x2="1"><stop offset="0" stop-color="#5a3d26"/><stop offset="0.55" stop-color="#8a6240"/><stop offset="1" stop-color="#4a3220"/></linearGradient>
  <radialGradient id="${p}-hoja" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#7fb069"/><stop offset="0.6" stop-color="#4c8a45"/><stop offset="1" stop-color="#2f5e33"/></radialGradient>
  <radialGradient id="${p}-sombra" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#000" stop-opacity="0.45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <radialGradient id="${p}-brillo" cx="0.35" cy="0.3" r="0.7"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.35" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>`;
}
const TRONCO = "M 270 700 C 278 610 282 540 268 470 C 250 420 210 400 180 380 M 330 700 C 322 610 318 540 330 470 C 345 420 390 400 420 380";
function tronco(p) {
  return `<ellipse cx="300" cy="704" rx="190" ry="22" fill="url(#${p}-sombra)"/>
  <path d="M 262 704 C 274 610 280 530 262 470 C 240 425 200 405 168 386 L 186 372 C 226 392 262 410 290 446 L 300 430 L 310 446 C 338 410 374 392 414 372 L 432 386 C 400 405 360 425 338 470 C 320 530 326 610 338 704 Z" fill="url(#${p}-tronco)"/>
  <path d="M 288 690 C 292 620 292 560 286 500" fill="none" stroke="#a87d55" stroke-width="5" stroke-linecap="round" opacity="0.6"/>`;
}
// Árbol bueno. `frutos` es una lista de colores (uno por hueco); cada fruto lleva la clase fr fr<i>.
function arbolBueno(p, frutos = []) {
  const copa = COPA.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${p}-hoja)"/>`).join("");
  const luces = COPA.map(([x, y, r]) => `<circle cx="${x - r * 0.25}" cy="${y - r * 0.3}" r="${r * 0.5}" fill="#9fcd7c" opacity="0.18"/>`).join("");
  const fr = frutos.map((c, i) => {
    const [x, y] = HUECOS[i];
    return `<g class="fr fr${i + 1}" transform="translate(${x} ${y})"><circle r="30" fill="${c}" stroke="rgba(0,0,0,0.35)" stroke-width="3"/>` +
      `<circle r="30" fill="url(#${p}-brillo)"/><path d="M 0 -30 C 2 -40 8 -46 14 -48" fill="none" stroke="#4a3220" stroke-width="4" stroke-linecap="round"/></g>`;
  }).join("");
  return `${arbolDefs(p)}<g class="arbol">${tronco(p)}<g class="copa">${copa}${luces}</g>${fr}</g>`;
}
// Árbol seco: el mismo tronco, ramas peladas y grises.
function arbolSeco(p) {
  const ramas = "M 180 380 C 140 340 120 300 110 250 M 150 350 C 110 345 80 330 60 300 M 420 380 C 460 340 480 290 485 240 M 450 350 C 500 350 530 330 548 300 " +
    "M 300 430 C 300 340 290 260 300 150 M 298 300 C 250 260 230 220 225 170 M 300 260 C 350 220 370 180 378 130 M 115 270 C 95 240 98 210 90 190 M 480 270 C 505 240 515 215 520 190";
  return `${arbolDefs(p)}<g class="arbol seco">${tronco(p).replace(`url(#${p}-tronco)`, "#5c5048")}` +
    `<path d="${ramas}" fill="none" stroke="#5c5048" stroke-width="16" stroke-linecap="round"/>` +
    `<path d="${ramas}" fill="none" stroke="#7a6c62" stroke-width="5" stroke-linecap="round" opacity="0.6"/></g>`;
}

pinta(".ab", arbolBueno("p16", ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"]));

entra(".conc", tB + 0.5, { y: 16 });
