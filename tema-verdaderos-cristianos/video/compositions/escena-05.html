// ---------- piezas de Génesis 42 al 47 que siguen sirviendo ----------
// "Empieza centrado y sube": el envoltorio arranca desplazado y sube cuando llega lo siguiente.
// Se mueve el envoltorio, no el bloque, para no pelear con entra().
function centra(x, y0, t1, d = 0.8) {
  tl.set(el(x), { y: y0 }, 0);
  tl.to(el(x), { y: 0, duration: d, ease: "power2.inOut" }, t1);
}
// Cámara que acompaña a un viajero: en cada cuadro centra el punto k del camino en la ventana V,
// mostrando una región de `ancho` px de la imagen. Los puntos ya vienen medidos (medirCamino).
function sigueCamino(cam, pts, t0, d, V, ancho, o = {}) {
  const c = el(cam)[0];
  const st = { k: o.desde ?? 0 };
  const N = pts.length - 1, alto = (ancho * V.h) / V.w;
  const cx = o.cx ?? 0.5, cy = o.cy ?? 0.5;
  const pon = (k) => {
    const [x, y] = pts[Math.min(N, Math.max(0, Math.round(k * N)))];
    gsap.set(c, encuadre({ x: x - ancho * cx, y: y - alto * cy, w: ancho, h: alto }, V));
  };
  tl.to(st, { k: o.hasta ?? 1, duration: d, ease: o.ease ?? "power1.inOut", onUpdate: () => pon(st.k) }, t0);
}

// ---------- las seis señales ----------
// Orden de Qué enseña la Biblia, cap. 15; el color de cada una se repite en todo el video.

// Marcado del índice: activa = número de la señal encendida (0 = ninguna).
function indiceHTML(activa = 0, o = {}) {
  return SENALES.map((t, i) => `<div class="ch c${i + 1} ch${i + 1}${i + 1 === activa ? " on" : ""}"><div class="n">${i + 1}</div><div class="t">${o.cortos ? o.cortos[i] : t}</div></div>`).join("");
}
// Cabecera de escena de señal: "SEÑAL 3" y el nombre, con su trazo.
function cabSenal(n, t) {
  entra(".cabs", t, { y: -16 });

}


let s = 1325;
const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
const N = 46, xs = [], tipo = [];
for (let i = 0; i < N; i++) { xs.push(30 + i * (1740 / (N - 1)) + (r() - 0.5) * 18); tipo.push(r() < 0.32 ? "c" : "t"); }
// Garantiza un ejemplo de cada uno donde van los rótulos.
tipo[14] = "t"; tipo[31] = "c";
let sem = "", mal = "", tal = "";
xs.forEach((x, i) => {
  const h = 250 + r() * 70, y0 = 424, top = y0 - h, cur = (r() - 0.5) * 30;
  if (tipo[i] === "t") sem += `<circle cx="${x.toFixed(1)}" cy="430" r="7" fill="#eadca6"/>`;
  else mal += `<circle cx="${x.toFixed(1)}" cy="430" r="7" fill="#20241a" stroke="#6b5040" stroke-width="2"/>`;
  // Espiga verde (igual en los dos) y espiga madura (distinta).
  let verde = "", madura = "";
  for (let k = 0; k < 7; k++) {
    const yy = top + 14 + k * 13;
    verde += `<ellipse cx="${(x + cur * 0.6 - 7).toFixed(1)}" cy="${yy.toFixed(1)}" rx="6" ry="10" fill="#86b862" transform="rotate(-20 ${(x + cur * 0.6 - 7).toFixed(1)} ${yy.toFixed(1)})"/><ellipse cx="${(x + cur * 0.6 + 7).toFixed(1)}" cy="${yy.toFixed(1)}" rx="6" ry="10" fill="#76a855" transform="rotate(20 ${(x + cur * 0.6 + 7).toFixed(1)} ${yy.toFixed(1)})"/>`;
  }
  if (tipo[i] === "t") {
    for (let k = 0; k < 8; k++) {
      const yy = top + 20 + k * 14, xx = x + cur * 0.6 + 26 + k * 2;
      madura += `<ellipse cx="${(xx - 9).toFixed(1)}" cy="${yy.toFixed(1)}" rx="9" ry="13" fill="#dcae4e" stroke="#9c7426" stroke-width="2" transform="rotate(-25 ${(xx - 9).toFixed(1)} ${yy.toFixed(1)})"/><ellipse cx="${(xx + 9).toFixed(1)}" cy="${yy.toFixed(1)}" rx="9" ry="13" fill="#e7bd5e" stroke="#9c7426" stroke-width="2" transform="rotate(25 ${(xx + 9).toFixed(1)} ${yy.toFixed(1)})"/>` +
        `<path d="M ${(xx - 12).toFixed(1)} ${yy - 8} l -16 -26 M ${(xx + 12).toFixed(1)} ${yy - 8} l 16 -26" stroke="#c9a04a" stroke-width="2"/>`;
    }
    madura = `<path d="M ${(x + cur * 0.6).toFixed(1)} ${top + 6} C ${(x + cur + 20).toFixed(1)} ${top - 4} ${(x + cur + 34).toFixed(1)} ${top + 30} ${(x + cur * 0.6 + 34).toFixed(1)} ${top + 120}" fill="none" stroke="#b88d3a" stroke-width="4"/>` + madura;
  } else {
    for (let k = 0; k < 8; k++) {
      const yy = top + 8 + k * 17, lado = k % 2 ? 1 : -1, xx = x + cur * 0.6 + lado * 7;
      madura += `<ellipse cx="${xx.toFixed(1)}" cy="${yy}" rx="5" ry="11" fill="#4f5a2c" stroke="#2e3418" stroke-width="2" transform="rotate(${lado * 18} ${xx.toFixed(1)} ${yy})"/>`;
    }
  }
  tal += `<g class="tallo ${tipo[i]} k${i}"><path d="M ${x.toFixed(1)} ${y0} C ${(x + cur * 0.2).toFixed(1)} ${(y0 - h * 0.4).toFixed(1)} ${(x + cur * 0.5).toFixed(1)} ${(y0 - h * 0.8).toFixed(1)} ${(x + cur * 0.6).toFixed(1)} ${top + 10}" fill="none" stroke="${tipo[i] === "t" ? "#7aa252" : "#6f9a4c"}" stroke-width="6" stroke-linecap="round"/>` +
    `<path d="M ${x.toFixed(1)} ${(y0 - h * 0.35).toFixed(1)} c ${(-30 - r() * 20).toFixed(1)} -20 -50 -10 -70 10" fill="none" stroke="#6f9a4c" stroke-width="5" stroke-linecap="round"/>` +
    `<g class="verde">${verde}</g><g class="madura">${madura}</g></g>`;
});
pinta(".semillas", sem); pinta(".malas", mal); pinta(".tallos", tal);
const xT = xs[14], xC = xs[31];
pinta(".lb-t", `<path d="M ${xT + 40} 70 L ${xT + 20} 110" stroke="var(--oro)" stroke-width="5"/><text class="et" x="${xT + 44}" y="62" fill="var(--oro)">trigo</text>`);
pinta(".lb-c", `<path d="M ${xC + 30} 70 L ${xC + 10} 112" stroke="var(--rojo)" stroke-width="5"/><text class="et" x="${xC + 34}" y="62" fill="var(--rojo)">cizaña</text>`);
$$(".madura").forEach((g) => gsap.set(g, { opacity: 0 }));

tl.set($$(".tallo"), { scaleY: 0, transformOrigin: "50% 100%" }, 0);
