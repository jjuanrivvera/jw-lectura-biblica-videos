secuencia([[".a1", 0.4], [".a2", at("Toda la tierra")], [".a3", at("Y tus descendientes")], [".a4", at("Vamos viaja")], [".a5", at("Algunos doctos")]]);
// Los cuatro puntos cardinales, con la voz.
[["N", "norte"], ["S", "sur"], ["E", "este"], ["O", "oeste"]].forEach(([k, w]) => {

for (let i = 0; i < 700; i++) s += `<circle cx="${(4 + azar() * 586).toFixed(1)}" cy="${(4 + azar() * 192).toFixed(1)}" r="${(1.6 + azar() * 2.6).toFixed(1)}"/>`;
