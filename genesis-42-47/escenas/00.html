<style>
.tit00 { position: absolute; left: 0; right: 0; top: 0; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.tit00 .grande { font-size: 168px; }
.tit00 .grande span { color: var(--oro); }
.tit00 .sub { font-family: "Caveat", cursive; font-weight: 700; font-size: 74px; color: var(--tiza); margin-top: 18px; }
.tit00 svg { width: 900px; height: 36px; margin-top: 10px; }
.tit00 svg path { fill: none; stroke: var(--oro); stroke-width: 7; stroke-linecap: round; }
.grid00 { position: absolute; left: 64px; right: 64px; top: 176px; bottom: 44px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 24px; }
.cuad { position: relative; overflow: hidden; border-radius: 22px; border: 4px solid rgba(241, 233, 216, 0.16); background: #0f171f; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5); }
.cuad .kb { position: absolute; inset: 0; }
.cuad img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cuad .vel { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 16, 22, 0) 35%, rgba(10, 16, 22, 0.9) 88%); }
.cuad .apaga { position: absolute; inset: 0; background: rgba(12, 18, 24, 0.72); }
.cuad .num { position: absolute; left: 26px; bottom: 14px; font-family: "Fraunces", serif; font-weight: 700; font-size: 104px; line-height: 1; color: var(--oro); text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6); }
.cuad .k { position: absolute; left: 176px; right: 18px; bottom: 26px; font-family: "Caveat", cursive; font-weight: 700; font-size: 50px; line-height: 1.0; color: var(--tiza); text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8); }
.cuad.c43 img { transform: scale(1.22); transform-origin: 50% 38%; }
.cab00 { position: absolute; left: 64px; right: 64px; top: 50px; display: flex; justify-content: space-between; align-items: baseline; }
.cab00 .t { font-family: "Fraunces", serif; font-weight: 700; font-size: 76px; line-height: 1; }
.cab00 .t span { color: var(--oro); }
.cab00 .l { font-family: "Caveat", cursive; font-weight: 700; font-size: 56px; color: var(--oro); }
</style>

<div class="tit00">
  <div class="grande">Génesis <span>42</span> al <span>47</span></div>
  <svg viewBox="0 0 900 36"><path d="M 20 22 C 240 8 520 30 880 14" /></svg>
  <div class="sub">una familia rota vuelve a estar junta</div>
</div>

<div class="cab00"><div class="t">Génesis <span>42</span> al <span>47</span></div><div class="l">al final: lecciones y preguntas para pensar</div></div>

<div class="grid00">
  <div class="cuad c42"><div class="kb" data-layout-allow-overflow><img src="assets/img/jose-llora.jpg" /></div><div class="vel"></div><div class="num">42</div><div class="k">diez hermanos bajan a comprar grano</div><div class="apaga"></div></div>
  <div class="cuad c43"><div class="kb" data-layout-allow-overflow><img src="assets/img/benjamin-grande.jpg" /></div><div class="vel"></div><div class="num">43</div><div class="k">vuelven con Benjamín</div><div class="apaga"></div></div>
  <div class="cuad c44"><div class="kb" data-layout-allow-overflow><img src="assets/img/copa-hist.jpg" /></div><div class="vel"></div><div class="num">44</div><div class="k">la copa de plata; Judá se ofrece</div><div class="apaga"></div></div>
  <div class="cuad c45"><div class="kb" data-layout-allow-overflow><img src="assets/img/jose-revela.jpg" /></div><div class="vel"></div><div class="num">45</div><div class="k">“Yo soy José”</div><div class="apaga"></div></div>
  <div class="cuad c46"><div class="kb" data-layout-allow-overflow><img src="assets/img/mudanza-hist.jpg" /></div><div class="vel"></div><div class="num">46</div><div class="k">Jacob baja a Egipto</div><div class="apaga"></div></div>
  <div class="cuad c47"><div class="kb" data-layout-allow-overflow><img src="assets/img/jose-administra.jpg" /></div><div class="vel"></div><div class="num">47</div><div class="k">Gosén y los años de hambre</div><div class="apaga"></div></div>
</div>

<script>
entra(".tit00 .grande", 0.4, { y: 50, d: 0.9 });
traza(".tit00 svg path", 1.0, 0.9);
escribe(".tit00 .sub", at("cómo la familia"), 1.3);
const t42 = at("En el cuarenta y dos");
sale(".tit00", t42 - 0.9, { y: -40, d: 0.5 });
entra(".cab00 .t", t42 - 0.5, { y: -20 });
aparece(".cuad", t42 - 0.6, 0.6);
const orden = [["c42", t42], ["c43", at("En el cuarenta y tres")], ["c44", at("En el cuarenta y cuatro")],
  ["c45", at("En el cuarenta y cinco")], ["c46", at("En el cuarenta y seis")], ["c47", at("Y en el cuarenta y siete")]];
orden.forEach(([c, t], i) => {
  const sig = i < orden.length - 1 ? orden[i + 1][1] : at("Al final veremos");
  tl.fromTo($(`.${c} .apaga`), { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.out", immediateRender: false }, t - 0.1);
  tl.fromTo($(`.${c}`), { borderColor: "rgba(241,233,216,0.16)", scale: 1 }, { borderColor: "rgba(233,191,96,0.95)", scale: 1.035, duration: 0.5, ease: "power2.out", immediateRender: false }, t - 0.1);
  tl.to($(`.${c}`), { borderColor: "rgba(241,233,216,0.22)", scale: 1, duration: 0.5, ease: "power2.inOut" }, sig - 0.2);
  kb(`.${c} .kb`, t - 0.1, sig + 0.4, { s: 1.0 }, { s: 1.08 });
});
escribe(".cab00 .l", at("Al final veremos"), 1.2);
</script>
