}


// Cinco gavillas: una para el faraón y cuatro para la familia.
function gavilla(alto) {
  let s = "";
  const n = 11;
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1) - 0.5;
    const xb = f * 46, xa = f * 16, xt = f * 92, yt = -alto + Math.abs(f) * 26;
    s += `<path d="M ${xb.toFixed(1)} 0 L ${xa.toFixed(1)} ${(-alto * 0.42).toFixed(1)} L ${xt.toFixed(1)} ${yt.toFixed(1)}" stroke="url(#g43-tallo)" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
    const ang = Math.atan2(xt - xa, -(yt + alto * 0.42)) * 57.3;
    s += `<ellipse cx="${xt.toFixed(1)}" cy="${(yt - 12).toFixed(1)}" rx="6.5" ry="17" fill="url(#g43-espiga)" transform="rotate(${ang.toFixed(1)} ${xt.toFixed(1)} ${(yt - 12).toFixed(1)})"/>`;
  }
  s += `<rect x="-17" y="${(-alto * 0.42 - 7).toFixed(1)}" width="34" height="14" rx="5" fill="#7a5320"/>`;
  return s;
}
