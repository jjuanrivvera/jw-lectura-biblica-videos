root.insertAdjacentHTML("afterbegin",
  '<svg width="0" height="0" style="position:absolute"><defs>' +
  '<filter id="tz-' + ID + '" x="-5%" y="-5%" width="110%" height="110%">' +
  '<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>' +
  '<feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs></svg>');
const TIZA = "url(#tz-" + ID + ")";

// El tablero de la promesa: ocho casillas que se llenan a lo largo del video.
const PROMESA = [
  { et: "Heredero", val: "tu propio hijo", vs: "15:4" },
  { et: "Descendencia", val: "como las estrellas", vs: "15:5" },
  { et: "Tiempo", val: "400 años", vs: "15:13" },
  { et: "Tierra", val: "del río de Egipto al Éufrates", vs: "15:18" },
  { et: "Señal", val: "la circuncisión", vs: "17:11" },
  { et: "Madre", val: "Sara", vs: "17:16" },
  { et: "Nombre", val: "Isaac, “risa”", vs: "17:19" },
  { et: "Fecha", val: "el próximo año", vs: "17:21 · 18:10" },
];
function tablero(contenedor, llenas = []) {
  const c = el(contenedor)[0];
  c.classList.add("tablero");
  c.innerHTML =
    '<div class="titulo">La promesa</div><div class="rejilla">' +
    PROMESA.map((p, i) =>
      '<div class="casilla" data-i="' + i + '"><div class="marco"></div><div class="et">' + p.et +
      '</div><div class="val" style="' + (llenas.includes(i) ? "" : "opacity:0") + '">' + p.val +
      '</div><div class="vs" style="' + (llenas.includes(i) ? "" : "opacity:0") + '">' + p.vs + "</div></div>").join("") +
    "</div>";
  const casilla = (i) => c.querySelector('.casilla[data-i="' + i + '"]');
  return {
    llenar(i, t) {
      const k = casilla(i);
      escribe(k.querySelector(".val"), t, 0.9);
      aparece(k.querySelector(".vs"), t + 0.6, 0.4);
      tl.fromTo(k.querySelector(".marco"), { opacity: 0 }, { opacity: 1, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut", ...IR }, t);
      tl.fromTo(k, { borderColor: "rgba(239,231,214,0.35)" }, { borderColor: "rgba(230,187,92,0.8)", duration: 0.6, ...IR }, t + 0.2);
    },
    casilla,
  };
}

// Tarjeta de capítulo: "Génesis 14" y su subtítulo, con la edad de Abrán.
function capitulo(x, t0, t1) {
  const c = el(x)[0];
  entra(c.querySelector(".num"), t0, { y: 60, d: 0.8 });
  escribe(c.querySelector(".sub"), t0 + 0.5, 0.9);
  traza(c.querySelectorAll("path"), t0 + 0.3, 0.8);
  if (c.querySelector(".edad")) entra(c.querySelector(".edad"), t0 + 0.9, { y: 20 });
  sale(c, t1, { y: -60, d: 0.6 });
}

// Entrada y salida de toda la escena: el fondo es común, solo se funde el contenido.
function marco() {
  tl.fromTo($(".contenido"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
  tl.to($(".contenido"), { opacity: 0, duration: 0.5, ease: "none" }, DUR - 0.55);
}


escribe(".q12 .cita", at("Él será"), 5.4);
entra(".nota", at("La nota"), { y: 20 });
entra(".c1", at("Y así fue"), { x: -30, y: 0 });
entra(".c2", at("Pero también"), { x: 30, y: 0 });
salta(".doce i", at("doce jefes") - 0.3, { st: 0.07, d: 0.3 });
sale(".fa", at("Esta es") - 0.4);
aparece(".fb", at("Esta es"), 0.6);
kb(".fb .kb", at("Esta es"), DUR, { s: 1.1, x: 2 }, { s: 1.0, x: -1 });
escribe(".pie2 .m", at("Esta es") + 0.4, 5.0);

marco();
window.__timelines[ID] = tl;
})();
</script>
</template>
