  const x = pts[i][0] + (pts[j][0] - pts[i][0]) * r, y = pts[i][1] + (pts[j][1] - pts[i][1]) * r;
  objs.forEach((e) => e.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")"));
}
// Solo el primer recorrido de un objeto fija su posición inicial; los siguientes
// arrancan donde terminó el anterior.
const _colocados = new WeakSet();
function recorre(obj, path, t, d, o = {}) {
  const pts = typeof path === "string" || path instanceof Element ? medirCamino(path) : path;
  const objs = el(obj);
  const st = { k: o.desde ?? 0 };
  if (!objs.some((e) => _colocados.has(e))) { objs.forEach((e) => _colocados.add(e)); ponEnCamino(objs, pts, st.k); }
  tl.to(st, { k: o.hasta ?? 1, duration: d, ease: o.ease ?? "power1.inOut", onUpdate: () => ponEnCamino(objs, pts, st.k) }, t);
}
function cuenta(x, desde, hasta, t, d, fmt = (v) => Math.round(v).toString()) {
  const e = el(x)[0];
  const st = { v: desde };
  if (!_colocados.has(e)) { _colocados.add(e); e.textContent = fmt(desde); }
  tl.to(st, { v: hasta, duration: d, ease: "power1.out", onUpdate: () => (e.textContent = fmt(st.v)) }, t);
}
function camara(x, t, d, props, ease = "power2.inOut") {
  tl.to(el(x), { ...props, duration: d, ease }, t);
}
// Paneo lento sobre una ilustración (Ken Burns), sin salirse del marco.
function kb(x, t0, t1, desde, hasta) {
  tl.fromTo(el(x), { scale: desde.s ?? 1.08, xPercent: desde.x ?? 0, yPercent: desde.y ?? 0 },
    { scale: hasta.s ?? 1.0, xPercent: hasta.x ?? 0, yPercent: hasta.y ?? 0, duration: Math.max(0.1, t1 - t0), ease: "none" }, t0);
}
const fmtMiles = (v) => Math.round(v).toLocaleString("es-CO");

// ---------- piezas repetidas ----------
// Filtro de tiza para los trazos: borde levemente irregular.
root.insertAdjacentHTML("afterbegin",
  '<svg width="0" height="0" style="position:absolute"><defs>' +
  '<filter id="tz-' + ID + '" x="-5%" y="-5%" width="110%" height="110%">' +
  '<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>' +
  '<feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs></svg>');
const TIZA = "url(#tz-" + ID + ")";

// El tablero de la promesa: ocho casillas que se llenan a lo largo del video.
const PROMESA = [
  { et: "Heredero", val: "tu propio hijo", vs: "15:4" },
  { et: "Descendencia", val: "como las estrellas", vs: "15:5" },
  { et: "Tiempo", val: "400 años", vs: "15:13" },
  { et: "Tierra", val: "del río de Egipto al Éufrates", vs: "15:18" },
  { et: "Señal", val: "la circuncisión", vs: "17:11" },
  { et: "Madre", val: "Sara", vs: "17:16" },
  { et: "Nombre", val: "Isaac, “risa”", vs: "17:19" },
  { et: "Fecha", val: "el próximo año", vs: "17:21 · 18:10" },
];
function tablero(contenedor, llenas = []) {
  const c = el(contenedor)[0];
  c.classList.add("tablero");
  c.innerHTML =
    '<div class="titulo">La promesa</div><div class="rejilla">' +
    PROMESA.map((p, i) =>
      '<div class="casilla" data-i="' + i + '"><div class="marco"></div><div class="et">' + p.et +
      '</div><div class="val" style="' + (llenas.includes(i) ? "" : "opacity:0") + '">' + p.val +
      '</div><div class="vs" style="' + (llenas.includes(i) ? "" : "opacity:0") + '">' + p.vs + "</div></div>").join("") +
    "</div>";
  const casilla = (i) => c.querySelector('.casilla[data-i="' + i + '"]');
  return {
    llenar(i, t) {
      const k = casilla(i);
      escribe(k.querySelector(".val"), t, 0.9);
      aparece(k.querySelector(".vs"), t + 0.6, 0.4);
      tl.fromTo(k.querySelector(".marco"), { opacity: 0 }, { opacity: 1, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut", ...IR }, t);
      tl.fromTo(k, { borderColor: "rgba(239,231,214,0.35)" }, { borderColor: "rgba(230,187,92,0.8)", duration: 0.6, ...IR }, t + 0.2);
    },
    casilla,
  };
}

// Tarjeta de capítulo: "Génesis 14" y su subtítulo, con la edad de Abrán.
function capitulo(x, t0, t1) {
  const c = el(x)[0];
  entra(c.querySelector(".num"), t0, { y: 60, d: 0.8 });
  escribe(c.querySelector(".sub"), t0 + 0.5, 0.9);
  traza(c.querySelectorAll("path"), t0 + 0.3, 0.8);
  if (c.querySelector(".edad")) entra(c.querySelector(".edad"), t0 + 0.9, { y: 20 });
  sale(c, t1, { y: -60, d: 0.6 });
}

// Entrada y salida de toda la escena: el fondo es común, solo se funde el contenido.
function marco() {
  tl.fromTo($(".contenido"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
  tl.to($(".contenido"), { opacity: 0, duration: 0.5, ease: "none" }, DUR - 0.55);
}


const T = tablero(".tab");
// La pregunta que abre y cierra el video.
escribe(".pregunta", at("Es que hay"), 1.6);
entra(".ref1", at("Génesis dieciocho"), { y: 20 });
traza(".llave-svg path", at("llave"), 0.9, { st: 0.25 });
camara(".pregunta", at("Génesis catorce") - 0.6, 0.9, { y: -170, scale: 0.72 });
sale([".ref1", ".llave"], at("Génesis catorce") - 0.6, { d: 0.4 });

// Cinco capítulos: de la guerra a la conversación.
traza(".fila .c", at("Génesis catorce"), 0.7, { st: 0.22 });
entra(".fila .n", at("Génesis catorce") + 0.2, { y: 16, st: 0.22 });
escribe(".et14", at("guerra") - 0.1, 0.7);
escribe(".et18", at("conversación") - 0.1, 0.9);
traza(".llave-o", at("En medio"), 1.1);
escribe(".veinticinco", at("veinticinco") - 0.2, 0.9);

// La espera, medida en la edad de Abrán.
salta(".e75", at("setenta y cinco"));
escribe(".l75", at("entró en Canaán") - 0.3, 0.9);
traza(".edades .linea", at("Tendrá"), 0.9);
traza(".edades .punta", at("Tendrá") + 0.8, 0.3);
salta(".e100", at("cien"));
escribe(".l100", at("nazca"), 0.7);
escribe(".nollega", at("Todo gira"), 1.0);

// Todo lo anterior se borra y aparece el tablero vacío.
sale(".fa", at("mientras la familia") - 0.2, { d: 0.7 });
entra(".tab .titulo", at("Jehová va aclarando"), { y: 30 });
entra(".tab .casilla", at("promesa"), { y: 30, st: 0.08 });
// Cada casilla se enciende cuando la voz la nombra.
[["heredero", 0], ["descendientes", 1], ["tierra", 3], ["tiempo", 2], ["llamará", 6], ["nacerá", 7]].forEach(([p, i]) => {
  const k = T.casilla(i);
  tl.to(k, { borderColor: "rgba(230,187,92,0.95)", duration: 0.35 }, at(p));
  tl.to(k.querySelector(".et"), { color: "#e6bb5c", duration: 0.35 }, at(p));
});
entra(".cierre .t1", at("Vamos a ir"), { y: 40 });
escribe(".cierre .t2", at("llenando") + 0.2, 1.3);

marco();
window.__timelines[ID] = tl;
})();
