<style>
.fa { position: absolute; inset: 0; }
.pregunta { position: absolute; left: 70px; right: 70px; top: 330px; text-align: center; font-size: 104px; line-height: 1.12; }
.pregunta b { color: var(--oro); font-weight: 600; }
.ref1 { position: absolute; left: 0; right: 0; top: 740px; text-align: center; font-size: 42px; color: var(--oro); }
.llave { position: absolute; left: 455px; top: 810px; width: 170px; height: 90px; }
.fila { position: absolute; left: 60px; right: 60px; top: 860px; height: 200px; }
.fila svg { position: absolute; inset: 0; width: 960px; height: 200px; }
.fila .n { position: absolute; top: 58px; width: 150px; text-align: center; font-family: "Georgia", serif; font-size: 70px; font-weight: 600; }
.et14, .et18 { position: absolute; top: 1090px; font-size: 70px; color: var(--rojo); }
.et14 { left: 40px; }
.et18 { right: 40px; color: var(--verde); }
.llave-svg .trazo, .fila .trazo { stroke-width: 5; }
.llave-svg path { stroke: var(--oro); }
.veinticinco { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-size: 80px; color: var(--oro); }
.edades { position: absolute; left: 60px; right: 60px; top: 1260px; height: 360px; }
.edades svg { position: absolute; inset: 0; width: 960px; height: 360px; }
.edades .e75, .edades .e100 { position: absolute; top: 40px; font-family: "Georgia", serif; font-size: 110px; font-weight: 600; }
.edades .e75 { left: 0; color: var(--tiza); }
.edades .e100 { right: 0; color: var(--oro); }
.edades .l75, .edades .l100 { position: absolute; top: 190px; font-size: 54px; color: var(--tenue); width: 380px; }
.edades .l75 { left: 0; }
.edades .l100 { right: 0; text-align: right; }
.nollega { position: absolute; left: 0; right: 0; top: 1660px; text-align: center; font-size: 76px; color: var(--oro); }
.tab { top: 250px; }
.tab .casilla.activa .et { color: var(--oro); }
.cierre { position: absolute; left: 60px; right: 60px; top: 1400px; text-align: center; }
.cierre .t1 { font-family: "Georgia", serif; font-weight: 600; font-size: 100px; line-height: 1.05; }
.cierre .t2 { font-size: 78px; color: var(--oro); margin-top: 18px; }
</style>

<div class="fa">
  <div class="pregunta biblia">“¿Es que hay algo imposible para <b>Jehová</b>?”</div>
  <div class="ref1 rotulo">Génesis 18:14</div>
  <svg class="llave llave-svg" viewBox="0 0 170 90">
    <path class="trazo" d="M40 45 m-26 0 a26 26 0 1 0 52 0 a26 26 0 1 0 -52 0" />
    <path class="trazo" d="M66 45 L160 45 M130 45 L130 68 M148 45 L148 62" />
  </svg>
  <div class="fila">
    <svg viewBox="0 0 960 200">
      <path class="trazo c" d="M75 100 m-66 0 a66 66 0 1 0 132 0 a66 66 0 1 0 -132 0" />
      <path class="trazo c" d="M277 100 m-66 0 a66 66 0 1 0 132 0 a66 66 0 1 0 -132 0" />
      <path class="trazo c" d="M479 100 m-66 0 a66 66 0 1 0 132 0 a66 66 0 1 0 -132 0" />
      <path class="trazo c" d="M681 100 m-66 0 a66 66 0 1 0 132 0 a66 66 0 1 0 -132 0" />
      <path class="trazo c" d="M883 100 m-66 0 a66 66 0 1 0 132 0 a66 66 0 1 0 -132 0" />
      <path class="trazo llave-o" style="stroke: var(--oro)" d="M20 -10 Q20 -40 60 -40 L900 -40 Q940 -40 940 -10" />
    </svg>
    <div class="n" style="left:0">14</div>
    <div class="n" style="left:202px">15</div>
    <div class="n" style="left:404px">16</div>
    <div class="n" style="left:606px">17</div>
    <div class="n" style="left:808px">18</div>
  </div>
  <div class="veinticinco mano">unos 25 años</div>
  <div class="et14 mano">una guerra</div>
  <div class="et18 mano">una conversación</div>
  <div class="edades">
    <svg viewBox="0 0 960 360">
      <path class="trazo linea" d="M250 110 L700 110" style="stroke-dasharray: none" />
      <path class="trazo punta" d="M672 88 L704 110 L672 132" />
    </svg>
    <div class="e75">75</div>
    <div class="l75 mano">años, entra en Canaán</div>
    <div class="e100">100</div>
    <div class="l100 mano">nace su hijo</div>
  </div>
  <div class="nollega mano">un hijo que no llega</div>
</div>

<div class="tab"></div>
<div class="cierre">
  <div class="t1">Génesis 14 al 18</div>
  <div class="t2 mano">una promesa que se va aclarando</div>
</div>

<script>
const T = tablero(".tab");
// La pregunta que abre y cierra el video.
escribe(".pregunta", at("Es que hay"), 1.6);
entra(".ref1", at("Génesis dieciocho"), { y: 20 });
traza(".llave-svg path", at("llave"), 0.9, { st: 0.25 });
camara(".pregunta", at("Génesis catorce") - 0.6, 0.9, { y: -170, scale: 0.72 });
sale([".ref1", ".llave"], at("Génesis catorce") - 0.6, { d: 0.4 });

// Cinco capítulos: de la guerra a la conversación.
traza(".fila .c", at("Génesis catorce"), 0.7, { st: 0.22 });
entra(".fila .n", at("Génesis catorce") + 0.2, { y: 16, st: 0.22 });
escribe(".et14", at("guerra") - 0.1, 0.7);
escribe(".et18", at("conversación") - 0.1, 0.9);
traza(".llave-o", at("En medio"), 1.1);
escribe(".veinticinco", at("veinticinco") - 0.2, 0.9);

// La espera, medida en la edad de Abrán.
salta(".e75", at("setenta y cinco"));
escribe(".l75", at("entró en Canaán") - 0.3, 0.9);
traza(".edades .linea", at("Tendrá"), 0.9);
traza(".edades .punta", at("Tendrá") + 0.8, 0.3);
salta(".e100", at("cien"));
escribe(".l100", at("nazca"), 0.7);
escribe(".nollega", at("Todo gira"), 1.0);

// Todo lo anterior se borra y aparece el tablero vacío.
sale(".fa", at("mientras la familia") - 0.2, { d: 0.7 });
entra(".tab .titulo", at("Jehová va aclarando"), { y: 30 });
entra(".tab .casilla", at("promesa"), { y: 30, st: 0.08 });
// Cada casilla se enciende cuando la voz la nombra.
[["heredero", 0], ["descendientes", 1], ["tierra", 3], ["tiempo", 2], ["llamará", 6], ["nacerá", 7]].forEach(([p, i]) => {
  const k = T.casilla(i);
  tl.to(k, { borderColor: "rgba(230,187,92,0.95)", duration: 0.35 }, at(p));
  tl.to(k.querySelector(".et"), { color: "#e6bb5c", duration: 0.35 }, at(p));
});
entra(".cierre .t1", at("Vamos a ir"), { y: 40 });
escribe(".cierre .t2", at("llenando") + 0.2, 1.3);
</script>
