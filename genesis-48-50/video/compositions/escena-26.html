function camara(x, t, d, props, ease = "power2.inOut") {
  tl.to(el(x), { ...props, duration: d, ease }, t);
}
// Paneo lento sobre una ilustración (Ken Burns), sin salirse del marco.
function kb(x, t0, t1, desde, hasta) {
  tl.fromTo(el(x), { scale: desde.s ?? 1.08, xPercent: desde.x ?? 0, yPercent: desde.y ?? 0 },
    { scale: hasta.s ?? 1.0, xPercent: hasta.x ?? 0, yPercent: hasta.y ?? 0, duration: Math.max(0.1, t1 - t0), ease: "none" }, t0);
}
const fmtMiles = (v) => Math.round(v).toLocaleString("es-CO");

// ---------- piezas repetidas ----------
// Filtro de tiza para los trazos: borde levemente irregular.
root.insertAdjacentHTML("afterbegin",
  '<svg width="0" height="0" style="position:absolute"><defs>' +

  '<feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>' +
  '<feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs></svg>');

// Tarjeta de capítulo: "Jeremías 37" y su subtítulo.
function capitulo(x, t0, t1) {
  const c = el(x)[0];
  entra(c.querySelector(".num"), t0, { y: 60, d: 0.8 });
  escribe(c.querySelector(".sub"), t0 + 0.5, 0.9);
  traza(c.querySelectorAll("path"), t0 + 0.3, 0.8);
  if (c.querySelector(".edad")) entra(c.querySelector(".edad"), t0 + 0.9, { y: 20 });
  sale(c, t1, { y: -60, d: 0.6 });
}

// Entrada y salida de toda la escena: el fondo es común, solo se funde el contenido.
function marco() {
  tl.fromTo($(".contenido"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 0);
  tl.to($(".contenido"), { opacity: 0, duration: 0.5, ease: "none" }, DUR - 0.55);
}

// Bloques de texto que se reemplazan en el mismo lugar: cada uno entra en su momento y sale
// justo antes del siguiente. Si `hasta` es null, el último se queda.
function secuencia(lista, hasta = null, o = {}) {
  lista.forEach(([s, t], i) => {
    entra(s, t, { y: o.y ?? 26, d: o.d ?? 0.55 });
    const sig = i < lista.length - 1 ? lista[i + 1][1] : hasta;
    if (sig != null) sale(s, sig - 0.4, { d: 0.35 });
  });
}
// Pone marcado SVG dentro de un elemento de la escena.
function pinta(sel, svg) { $(sel).innerHTML = svg; }

// ---------- mapas ----------
// Encuadre de cámara: lleva la región {x, y, w, h} de la imagen del mapa a la ventana
// {x, y, w, h} de la pantalla (relativa al contenedor .mapa), sin deformarla.
function encuadre(r, v) {
  const s = Math.min(v.w / r.w, v.h / r.h);
  return { scale: +s.toFixed(4), x: +(v.x + (v.w - r.w * s) / 2 - r.x * s).toFixed(1), y: +(v.y + (v.h - r.h * s) / 2 - r.y * s).toFixed(1) };
}
// Latido de un marcador: crece y vuelve, un número finito de veces.
function late(x, t, o = {}) {
  tl.fromTo(el(x), { scale: 1 }, { scale: o.s ?? 1.35, transformOrigin: "50% 50%", duration: o.d ?? 0.35, yoyo: true, repeat: o.n ?? 3, ease: "power1.inOut", immediateRender: false }, t);
}

// ---------- lecciones ----------
// Cada lección entra en su momento y sale antes de la siguiente; el número cuenta.
function lecciones(lista) {
  const cab = $(".seccion");
  if (cab) { entra(cab, 0.3, { y: -20 }); traza(".seccion-linea path", 0.6, 1.0); }
  secuencia(lista, null, { y: 30, d: 0.6 });
}

// ---------- piezas nuevas (Génesis 42 al 47) ----------
// "Empieza centrado y sube": el envoltorio arranca desplazado y sube cuando llega lo siguiente.
// Se mueve el envoltorio, no el bloque, para no pelear con entra().
function centra(x, y0, t1, d = 0.8) {
  tl.set(el(x), { y: y0 }, 0);
  tl.to(el(x), { y: 0, duration: d, ease: "power2.inOut" }, t1);
}
// Cámara que acompaña a un viajero: en cada cuadro centra el punto k del camino en la ventana V,
// mostrando una región de `ancho` px de la imagen. Los puntos ya vienen medidos (medirCamino).
function sigueCamino(cam, pts, t0, d, V, ancho, o = {}) {
  const c = el(cam)[0];
  const st = { k: o.desde ?? 0 };
  const N = pts.length - 1, alto = (ancho * V.h) / V.w;
  const cx = o.cx ?? 0.5, cy = o.cy ?? 0.5;
  const pon = (k) => {
    const [x, y] = pts[Math.min(N, Math.max(0, Math.round(k * N)))];
    gsap.set(c, encuadre({ x: x - ancho * cx, y: y - alto * cy, w: ancho, h: alto }, V));
  };
  tl.to(st, { k: o.hasta ?? 1, duration: d, ease: o.ease ?? "power1.inOut", onUpdate: () => pon(st.k) }, t0);
}

// Los doce hijos de Jacob, en el orden en que Génesis cuenta sus nacimientos (29:32 a 30:24; 35:18),
// con su madre. Retratos de La Atalaya (estudio), junio de 2025, "Qué nos enseñan las últimas palabras
// de Jacob", partes 1 y 2.
const HIJOS = [
  ["ruben", "Rubén", "lea"], ["simeon", "Simeón", "lea"], ["levi", "Leví", "lea"], ["juda", "Judá", "lea"],
  ["dan", "Dan", "bilha"], ["neftali", "Neftalí", "bilha"], ["gad", "Gad", "zilpa"], ["aser", "Aser", "zilpa"],
  ["isacar", "Isacar", "lea"], ["zabulon", "Zabulón", "lea"], ["jose", "José", "raquel"], ["benjamin", "Benjamín", "raquel"],
];
const HIJO = Object.fromEntries(HIJOS.map(([k, n, m], i) => [k, { k, n, m, i }]));
// Medallón con el retrato: <div class="med lea r-ruben">foto + nombre</div>.
function medallon(k, o = {}) {
  const h = HIJO[k];
  return `<div class="med ${h.m} r-${k} ${o.clase ?? ""}" style="${o.estilo ?? ""}"><div class="foto"><img src="assets/img/${k}.jpg" /></div>` +
    (o.sinNombre ? "" : `<div class="n">${h.n}</div>`) + `</div>`;
}

// ---------- piezas nuevas (Génesis 48 al 50) ----------
// Rótulo de mapa con fondo, en coordenadas de la imagen. El ancho se estima con la métrica
// de Montserrat 800 (unos 0,64 em por letra), con margen, para que el texto no se salga del recuadro.
function chip(x, y, texto, o = {}) {
  const fs = o.fs ?? 40, pad = fs * 0.42, w = Math.round(texto.length * fs * (o.em ?? 0.64) + pad * 2), h = Math.round(fs * 1.5);
  const ax = o.ancla === "der" ? x - w : o.ancla === "centro" ? x - w / 2 : x;
  return `<g class="mchip ${o.cls ?? ""}"><rect x="${ax}" y="${y - h / 2}" width="${w}" height="${h}" rx="${fs * 0.28}"/>` +
    `<text x="${ax + pad}" y="${y + fs * 0.36}" font-size="${fs}">${texto}</text></g>`;
}
// Punto de lugar con borde blanco.
function punto(x, y, o = {}) {
  return `<circle class="${o.cls ?? ""}" cx="${x}" cy="${y}" r="${o.r ?? 14}" fill="${o.color ?? "#c0392b"}" stroke="#fff" stroke-width="${o.sw ?? 5}"/>`;
}

// Patrón de los hijos (escenas 25 a 32). El retrato (620 px en 110,200) pasa a medallón de 230 px
// en 1130,96 cuando entra el mapa; el nombre grande se queda junto al medallón.

}
function hijoAMapa(t, d = 1.1) {

  sale(".pres", t - 0.15, { y: -20, d: 0.4 });

// Flecha recta con punta, en coordenadas del mapa. La punta es un <path> aparte (clase cls + "-p").
function flecha(x1, y1, x2, y2, cls, o = {}) {
  const c = o.color ?? "#b8430f", w = o.w ?? 14, L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  const h = w * 2.6, bx = x2 - ux * h, by = y2 - uy * h, px = -uy * w * 1.6, py = ux * w * 1.6;
  const dash = o.punt ? ` stroke-dasharray="${w * 2} ${w * 1.6}"` : "";
  return `<path class="${cls}" d="M ${x1} ${y1} L ${bx.toFixed(1)} ${by.toFixed(1)}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"${dash}/>` +
    `<path class="${cls}-p" d="M ${x2} ${y2} L ${(bx + px).toFixed(1)} ${(by + py).toFixed(1)} L ${(bx - px).toFixed(1)} ${(by - py).toFixed(1)} Z" fill="${c}"/>`;
}
