// Una vid en espaldera: tronco, copa de hojas a lo largo del alambre y racimos colgando.
function vid(x, y, s, fila) {
  const racimo = (cx, cy) => {
    let g = "";
    [[4, 0], [3, 1], [3, 2], [2, 3], [1, 4]].forEach(([n, f]) => {
      for (let i = 0; i < n; i++) g += `<circle cx="${(cx + (i - (n - 1) / 2) * 15 * s).toFixed(1)}" cy="${(cy + f * 13 * s).toFixed(1)}" r="${(8.5 * s).toFixed(1)}" fill="${(i + f) % 2 ? "#5b2d6e" : "#6f3a85"}" stroke="#3b1b48" stroke-width="${(1.6 * s).toFixed(1)}"/>`;
    });
    return `<g class="rac24 r${fila}">${g}<circle cx="${(cx - 9 * s).toFixed(1)}" cy="${(cy + 2 * s).toFixed(1)}" r="${(3 * s).toFixed(1)}" fill="#c9a6d8" opacity="0.7"/></g>`;
  };
  const j = (k) => ((x * 7 + k * 13) % 11) - 5;
  const hojas = [-95, -62, -30, 0, 30, 62, 95].map((dx, i) =>
    `<ellipse cx="${(x + dx * s).toFixed(1)}" cy="${(y - 150 * s + ((i % 2 ? -14 : 6) + j(i) * 2) * s).toFixed(1)}" rx="${((34 + j(i + 3)) * s).toFixed(1)}" ry="${((26 + j(i + 5) * 0.6) * s).toFixed(1)}" fill="${i % 3 ? "#5f8f3e" : "#79a94b"}" stroke="#3e6527" stroke-width="${(2 * s).toFixed(1)}"/>`).join("");
  return `<g class="vid24 f${fila}">
    <path d="M ${x} ${y} C ${x - 8 * s} ${y - 50 * s} ${x + 10 * s} ${y - 90 * s} ${x} ${y - 140 * s}" fill="none" stroke="#5a3d24" stroke-width="${16 * s}" stroke-linecap="round"/>
    <path d="M ${x - 120 * s} ${y - 140 * s} L ${x + 120 * s} ${y - 140 * s}" stroke="#8f8574" stroke-width="${3 * s}"/>
    ${hojas}${racimo(x - 60 * s, y - 118 * s)}${racimo(x + 4 * s, y - 112 * s)}${racimo(x + 64 * s, y - 120 * s)}</g>`;
};
