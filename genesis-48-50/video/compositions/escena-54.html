// "Empieza centrado y sube": el envoltorio arranca desplazado y sube cuando llega lo siguiente.
// Se mueve el envoltorio, no el bloque, para no pelear con entra().
function centra(x, y0, t1, d = 0.8) {
  tl.set(el(x), { y: y0 }, 0);
  tl.to(el(x), { y: 0, duration: d, ease: "power2.inOut" }, t1);
}
// Cámara que acompaña a un viajero: en cada cuadro centra el punto k del camino en la ventana V,
// mostrando una región de `ancho` px de la imagen. Los puntos ya vienen medidos (medirCamino).
function sigueCamino(cam, pts, t0, d, V, ancho, o = {}) {
  const c = el(cam)[0];
  const st = { k: o.desde ?? 0 };
  const N = pts.length - 1, alto = (ancho * V.h) / V.w;
  const cx = o.cx ?? 0.5, cy = o.cy ?? 0.5;
  const pon = (k) => {
    const [x, y] = pts[Math.min(N, Math.max(0, Math.round(k * N)))];
    gsap.set(c, encuadre({ x: x - ancho * cx, y: y - alto * cy, w: ancho, h: alto }, V));
  };
  tl.to(st, { k: o.hasta ?? 1, duration: d, ease: o.ease ?? "power1.inOut", onUpdate: () => pon(st.k) }, t0);
}

// Los doce hijos de Jacob, en el orden en que Génesis cuenta sus nacimientos (29:32 a 30:24; 35:18),
// con su madre. Retratos de La Atalaya (estudio), junio de 2025, "Qué nos enseñan las últimas palabras
// de Jacob", partes 1 y 2.
const HIJOS = [
  ["ruben", "Rubén", "lea"], ["simeon", "Simeón", "lea"], ["levi", "Leví", "lea"], ["juda", "Judá", "lea"],
  ["dan", "Dan", "bilha"], ["neftali", "Neftalí", "bilha"], ["gad", "Gad", "zilpa"], ["aser", "Aser", "zilpa"],
  ["isacar", "Isacar", "lea"], ["zabulon", "Zabulón", "lea"], ["jose", "José", "raquel"], ["benjamin", "Benjamín", "raquel"],
];
const HIJO = Object.fromEntries(HIJOS.map(([k, n, m], i) => [k, { k, n, m, i }]));
// Medallón con el retrato: <div class="med lea r-ruben">foto + nombre</div>.
function medallon(k, o = {}) {
  const h = HIJO[k];
  return `<div class="med ${h.m} r-${k} ${o.clase ?? ""}" style="${o.estilo ?? ""}"><div class="foto"><img src="assets/img/${k}.jpg" /></div>` +
    (o.sinNombre ? "" : `<div class="n">${h.n}</div>`) + `</div>`;
}

// ---------- piezas nuevas (Génesis 48 al 50) ----------
// Rótulo de mapa con fondo, en coordenadas de la imagen. El ancho se estima con la métrica
// de Montserrat 800 (unos 0,64 em por letra), con margen, para que el texto no se salga del recuadro.
function chip(x, y, texto, o = {}) {
  const fs = o.fs ?? 40, pad = fs * 0.42, w = Math.round(texto.length * fs * (o.em ?? 0.64) + pad * 2), h = Math.round(fs * 1.5);
  const ax = o.ancla === "der" ? x - w : o.ancla === "centro" ? x - w / 2 : x;
  return `<g class="mchip ${o.cls ?? ""}"><rect x="${ax}" y="${y - h / 2}" width="${w}" height="${h}" rx="${fs * 0.28}"/>` +
    `<text x="${ax + pad}" y="${y + fs * 0.36}" font-size="${fs}">${texto}</text></g>`;
}
// Punto de lugar con borde blanco.
function punto(x, y, o = {}) {
  return `<circle class="${o.cls ?? ""}" cx="${x}" cy="${y}" r="${o.r ?? 14}" fill="${o.color ?? "#c0392b"}" stroke="#fff" stroke-width="${o.sw ?? 5}"/>`;
}
